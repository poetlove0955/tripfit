<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripFit — 지금 진짜 싼 항공권·숙소, 1년치 값으로 확인하고 알려드립니다</title>
<style>
/* 색은 창 프로그램(트립핏_디자인.py)에서 그대로 가져왔다 — 같은 프로그램으로 보여야 한다 */
:root{
  --배경:#eef2f4; --카드:#fff; --테두리:#e2e9eb; --진테두리:#cfdadd;
  --글자:#0f1416; --보조:#5f7075; --연보조:#8b989c;
  --브랜드:#0d697c; --브랜드밝:#2bbfc0; --브랜드연:#e6f4f6;
  --초록:#1e8449; --빨강:#c0392b; --금:#b7791f; --줄무늬:#f7fafb;
  --옆폭:300px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--배경); color:var(--글자);
  font-family:"Pretendard","맑은 고딕","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer}
a{color:inherit}

/* ───────────────────────────────────────────── 위쪽 바 */
.머리{background:var(--카드); border-bottom:1px solid var(--테두리); position:sticky; top:0; z-index:30}
.머리안{display:flex; align-items:center; gap:14px; padding:10px 16px; flex-wrap:wrap}
.로고{display:flex; align-items:center; gap:7px; font-size:20px; font-weight:800;
      color:var(--브랜드); letter-spacing:-.5px; white-space:nowrap}
.로고 em{font-style:normal; color:var(--브랜드밝)}
.탭줄{display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none}
.탭줄::-webkit-scrollbar{display:none}
.탭{border:1px solid transparent; background:none; color:var(--보조);
    padding:8px 14px; border-radius:9px; font-size:14px; font-weight:600; white-space:nowrap}
.탭:hover{background:var(--줄무늬)}
.탭.켬{background:var(--브랜드연); color:var(--브랜드); border-color:#bfe3e8}
.머리단추{display:flex; gap:7px; flex-shrink:0}
.연버튼{background:var(--카드); border:1px solid var(--진테두리); color:var(--보조);
        padding:7px 12px; border-radius:8px; font-size:13px; font-weight:600}
.연버튼:hover{border-color:var(--브랜드밝); color:var(--브랜드)}

/* ───────────────────────────────────────────── 판 */
.판{display:flex; align-items:flex-start; gap:0; min-height:calc(100vh - 56px)}
.옆{width:var(--옆폭); flex:0 0 var(--옆폭); background:var(--카드);
    border-right:1px solid var(--테두리); align-self:stretch;
    position:sticky; top:56px; height:calc(100vh - 56px); display:flex; flex-direction:column}
.옆속{flex:1; overflow-y:auto; padding:16px}
.옆밑{border-top:1px solid var(--테두리); padding:12px 16px}
.본{flex:1; min-width:0; padding:12px 16px 40px}

.쪽제목{font-size:12px; color:var(--연보조); margin:16px 0 6px}
.쪽제목:first-child{margin-top:0}

.접머리{cursor:pointer; user-select:none}
.접머리 b{color:var(--브랜드); font-size:14px}
.접머리 span{display:block; color:var(--연보조); font-size:12px; margin-top:3px; white-space:pre-line}

select,input[type=text],input[type=number],input[type=date],input[type=password]{
  width:100%; padding:9px 10px; border:1px solid var(--진테두리); border-radius:8px;
  font-size:14px; font-family:inherit; background:#fff; color:var(--글자)}
select:focus,input:focus{outline:2px solid var(--브랜드밝); outline-offset:-1px}

.칩줄{display:flex; flex-wrap:wrap; gap:6px}
.칩{border:1px solid var(--진테두리); background:#fff; color:var(--보조);
    padding:7px 11px; border-radius:20px; font-size:13px; font-weight:600; white-space:nowrap}
.칩.켬{background:var(--브랜드연); border-color:var(--브랜드밝); color:var(--브랜드)}
.세로칩{width:100%; text-align:left; border:none; background:none;
        padding:8px 10px; border-radius:8px; color:var(--보조); font-size:14px;
        display:flex; justify-content:space-between; align-items:center; gap:8px}
.세로칩:hover{background:var(--줄무늬)}
.세로칩.켬{background:var(--브랜드연); color:var(--브랜드); font-weight:700;
           box-shadow:inset 3px 0 0 var(--브랜드)}
.세로칩 i{font-style:normal; font-size:12px; color:var(--연보조)}

/* '찾은 곳' — 좁은 화면에선 한 번 쫙 펴 보여준 뒤 저 혼자 접힌다 (자리를 너무 먹는다) */
.지역머리{display:flex; align-items:center; gap:8px}
.지역요약,.지역화살{display:none}
.지역감{overflow:hidden; transition:max-height .4s ease, opacity .3s ease}

.큰버튼{width:100%; background:var(--브랜드); color:#fff; border:none; border-radius:10px;
        padding:14px; font-size:16px; font-weight:700; letter-spacing:-.3px}
.큰버튼:hover{background:#0a5666}
.큰버튼:disabled{background:#9ab6bc; cursor:default}
.체크{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; color:var(--보조); cursor:pointer}
.체크 input{width:16px; height:16px; accent-color:var(--브랜드)}

/* ───────────────────────────────────────────── 결과 */
.상태줄{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        color:var(--보조); font-size:13px; padding:4px 4px 10px}
.막대{height:3px; background:var(--테두리); border-radius:2px; overflow:hidden; width:100%; margin-bottom:10px}
.막대 i{display:block; height:100%; background:var(--브랜드밝); width:0; transition:width .3s}
.막대.흐름 i{width:35%; animation:흐름 1.1s ease-in-out infinite}
@keyframes 흐름{0%{margin-left:-35%}100%{margin-left:100%}}

.도구{background:var(--카드); border:1px solid var(--테두리); border-radius:12px;
      padding:12px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.결과글{font-size:19px; font-weight:800; margin-right:6px}

.카드{background:var(--카드); border:1px solid var(--테두리); border-radius:12px;
      padding:16px 18px; margin-bottom:10px}
.카드머리{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.카드왼{flex:1; min-width:0}
.도시{font-size:21px; font-weight:800; letter-spacing:-.5px}
.나라{font-size:12px; color:var(--연보조); margin-left:7px; font-weight:500}
.딱지{display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px;
      font-weight:700; margin-left:8px; vertical-align:3px}
.딱지.특가{background:#fdecea; color:#b32d1f}
.딱지.싼{background:var(--브랜드연); color:var(--브랜드)}
.딱지.법{background:#f2f6f7; color:var(--보조)}
.줄정보{color:var(--보조); font-size:14px; margin-top:7px}
.카드오{text-align:right; flex-shrink:0}
.값{font-size:24px; font-weight:800; color:var(--브랜드); letter-spacing:-.6px; white-space:nowrap}
.값밑{font-size:12px; color:var(--연보조); margin-top:2px}
.평소{font-size:12px; color:var(--연보조); margin-top:3px}
.평소 s{margin-right:5px}
.평소 b{color:var(--빨강)}
/* 값칸·카드메타 = 넓은 화면에서만 쓰는 묶음.
   여기선 display:contents 라 **없는 것처럼** 흘러간다 → 폰 화면은 예전 그대로다. */
.값칸,.카드메타{display:contents}
/* 이 값이 진짜인가 — 실제로 파는 곳에 물어본 결과 */
.확인{font-size:12px; margin-top:6px; padding:5px 8px; border-radius:7px; line-height:1.45;
      font-weight:600; max-width:340px}
.확인.좋{background:#e8f6ee; color:#1c7a4a}
.확인.갸웃{background:#fdf4e3; color:#8a5a12}
.확인.나쁨{background:#fdecea; color:#b32d1f}
.확인.아직{background:none; color:var(--연보조); font-weight:500; padding:2px 0}
.별{background:none; border:none; font-size:20px; color:var(--연보조); padding:0 4px; line-height:1}
.별.켬{color:var(--금)}
/* [🏨 숙소] [상세보기] — 넓은 화면에선 아랫줄 오른쪽, 좁은 화면에선 값 옆으로 올라붙는다.
   단추가 둘이 됐으니 자리는 flex 가 잡는다 (예전엔 text-align 하나로 됐다). */
.살줄{flex:0 0 100%; margin-top:4px;
      display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap}
.살버튼{padding:5px 11px; font-size:13px; white-space:nowrap}
.숙소단추{border-color:#bfe3e8; color:var(--브랜드); background:var(--브랜드연)}
.숙소단추:hover{background:var(--브랜드); border-color:var(--브랜드); color:#fff}

/* 어디서 사나요 — 여섯 군데를 **같은 크기로** 늘어놓는다.
   예전엔 네이버만 진한 색이라 '여기가 제일 싸다'로 읽혔다. 실제론 카약이 더 쌀 때가 있다.
   그래서 색은 **점 하나로만** 내고, 값이 어디서 온 값인지는 [이 값] 딱지로 밝힌다. */
.살곳{margin-top:12px; padding-top:11px; border-top:1px dashed var(--테두리)}
.살곳머리{font-size:12px; color:var(--연보조); margin-bottom:8px; line-height:1.5}
.살곳머리 em{font-style:normal; color:var(--보조); font-weight:700}
/* 단추는 **앞글자 한 자**만 (스 트 키 네 구 카 직). 여섯 칸이 한 줄에 들어가고,
   카드가 안 커진다. 어디인지는 동그라미 색 + 손 올리면 뜨는 이름으로 안다.
   값을 물어본 곳만 옆에 값이 붙으니, 붙은 쪽이 곧 '실제로 확인한 곳'이다. */
.예약{display:flex; flex-wrap:wrap; gap:6px}
.예약 a{display:inline-flex; align-items:center; gap:5px; text-decoration:none;
        background:#fff; border:1px solid var(--진테두리); border-radius:999px;
        padding:3px 9px 3px 3px; color:var(--보조);
        transition:border-color .15s, box-shadow .15s, transform .1s}
.예약 a.민{padding:3px}                     /* 값이 없는 곳은 동그라미 하나 — 제일 작다 */
.예약 a:hover{border-color:var(--점,var(--브랜드밝)); color:var(--글자);
              box-shadow:0 2px 8px rgba(11,90,107,.13); transform:translateY(-1px)}
.예약 a i{width:22px; height:22px; border-radius:50%; flex:none; font-style:normal;
          display:flex; align-items:center; justify-content:center;
          font-size:12px; font-weight:800; color:#fff; background:var(--점,#9aa7ab)}
.예약 a b{font-size:11px; font-weight:800; letter-spacing:-.3px; color:var(--보조)}
/* 제일 싼 곳 — 테두리째 브랜드색으로 (값딱만 칠하면 눈에 안 들어왔다) */
.예약 a.싼곳{border-color:var(--브랜드); background:var(--브랜드연)}
.예약 a.싼곳 b{color:var(--브랜드)}
/* 🛑 네이버 달력값은 **물어본 값이 아니다.** 그렇다고 안 보여주면 화면이 거짓말을
   한다 — 카드값이 원래 여기서 나왔는데 "안 물어본 곳"이라고 적히기 때문이다
   (8/11 요나고에서 대표가 잡아낸 자리). 그래서 값은 보여주되 **흐리고 점선으로**
   구분한다. 확인한 값과 같은 굵기로 쓰면 그게 또 거짓말이다. */
.예약 a.달력{border-style:dashed}
.예약 a b.달력값{color:var(--연보조); font-weight:700}
/* 못 믿을 값이라 뺀 곳 — 빈 동그라미(안 물어봄)와 반드시 달라 보여야 한다 */
.예약 a.막힘{border-color:#e8b4b4; background:#fff7f7}
.예약 a b.막힘딱{color:#c0392b}
.구간표{font-size:12px; color:var(--보조); font-weight:700; margin:10px 0 6px}
.구간표:first-child{margin-top:0}

.빈{text-align:center; padding:70px 20px; color:var(--연보조)}
.빈 .큰{font-size:54px; color:#dce6e8; line-height:1}
.밑줄{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;
      background:var(--카드); border:1px solid var(--테두리); border-radius:12px;
      padding:12px 14px; margin-top:14px}
.밑줄 .말{flex:1; min-width:180px; font-size:13px; color:var(--연보조); text-align:left}
.밑줄 .말.켬{color:var(--브랜드); font-weight:600}

/* ─────────────────── 찾는 동안만 나오는 칸 (다 찾으면 저 혼자 사라진다)
   예전엔 여기 검은 로그창이 그대로 있었다. 훑은 줄이 수십 개씩 쌓여서
   손님 눈엔 '고장난 화면'으로 보였다 — 그래서 **한 번에 한 마디**만 남겼다. */
.비행{background:var(--카드); border:1px solid var(--테두리); border-radius:14px;
      padding:20px 24px 16px; margin-bottom:12px; text-align:center;
      transition:opacity .45s ease, transform .45s ease}
.비행.사라짐{opacity:0; transform:translateY(-8px)}
.하늘{position:relative; height:56px; margin-bottom:4px; overflow:hidden}
.하늘 .길{position:absolute; left:0; right:0; top:50%; border-top:2px dashed #d9e8eb}
.비행기{position:absolute; top:50%; font-size:26px; line-height:1;
        animation:날기 3s cubic-bezier(.45,0,.55,1) infinite}
@keyframes 날기{
  0%  {left:-9%;  transform:translateY(-50%) rotate(-8deg)}
  45% {           transform:translateY(-92%) rotate(4deg)}
  100%{left:105%; transform:translateY(-50%) rotate(-8deg)}
}
.구름{position:absolute; color:#eaf3f5; animation:흘러 7s linear infinite}
.구름1{top:2px;  font-size:22px; animation-duration:6s}
.구름2{top:32px; font-size:16px; animation-duration:9.5s; animation-delay:-3s}
.구름3{top:12px; font-size:30px; animation-duration:13s; animation-delay:-7s}
@keyframes 흘러{0%{left:106%}100%{left:-16%}}
.비행 .말{font-size:18px; font-weight:800; letter-spacing:-.4px; color:var(--브랜드)}
.비행 .곁말{font-size:13px; color:var(--연보조); margin-top:6px; min-height:19px}
.비행 .막대{margin:14px auto 0; max-width:430px}
.비행 .진행글{margin-top:9px; font-size:12px; color:var(--연보조);
              display:flex; gap:12px; justify-content:center; align-items:center}
.진행자세히{background:none; border:none; color:var(--연보조); font-size:12px;
            text-decoration:underline; padding:0}
.진행자세히:hover{color:var(--브랜드)}
.로그{background:#0f1416; color:#9fd8de; font-family:Consolas,monospace; font-size:11px;
      border-radius:10px; padding:10px 12px; max-height:150px; overflow:auto;
      white-space:pre-wrap; text-align:left; margin:12px 0 0}
/* 움직임이 불편한 사람에겐 안 흔든다 */
@media (prefers-reduced-motion: reduce){
  .비행기,.구름{animation:none}
  .지역감{transition:none}
  .비행기{left:46%; transform:translateY(-50%)}
}

/* ─────────────────────────────────────────────── 🏨 숙박
   항공 카드와 **같은 뼈대**(.카드)를 쓰되, 숙박은 봐야 할 게 다르다:
   값 하나가 아니라 [값 · 후기 · 위치] 세 가지를 한눈에 재야 한다.
   그래서 왼쪽에 사진, 가운데에 세 줄, 오른쪽에 값 — 이 배치가 굳어 있다. */
.숙카드{display:flex; gap:13px; align-items:flex-start}
.숙사진{width:96px; height:96px; flex:none; border-radius:10px; object-fit:cover;
        background:var(--줄무늬); border:1px solid var(--테두리)}
.숙사진.빔{display:flex; align-items:center; justify-content:center;
           font-size:26px; color:#cfdcdf}
.숙속{flex:1; min-width:0}
.숙이름{font-size:17px; font-weight:800; letter-spacing:-.3px; line-height:1.3;
        display:block; color:var(--글자); text-decoration:none}
.숙이름:hover{color:var(--브랜드); text-decoration:underline}
.숙줄{font-size:13px; color:var(--보조); margin-top:5px; display:flex;
      flex-wrap:wrap; gap:4px 10px; align-items:center}
/* 🛑 가까운 역 이름이 'Jinshan Passenger Transport Station' 처럼 길 때가 있다.
   nowrap 만 걸어 두면 그 한 줄이 폰 화면을 통째로 밀어 가로 스크롤을 만든다. */
.숙줄 .조각{white-space:nowrap; max-width:100%; min-width:0;
            overflow:hidden; text-overflow:ellipsis}
.후기알{background:var(--브랜드); color:#fff; font-weight:800; font-size:12px;
        padding:2px 7px; border-radius:6px}
.후기알.낮{background:#9aa7ab}
.후기알.없{background:none; color:var(--연보조); font-weight:600; padding:2px 0}
.숙값칸{flex:none; text-align:right; min-width:126px}
.숙값{font-size:21px; font-weight:800; color:var(--브랜드); letter-spacing:-.5px;
      white-space:nowrap}
.숙값밑{font-size:11px; color:var(--연보조); margin-top:2px; line-height:1.5}
.숙값밑 b{color:var(--보조)}
/* 가성비 막대 — 숫자만 던지면 90 이 좋은 건지 나쁜 건지 모른다. 길이로 같이 보여준다 */
.가성비줄{display:flex; align-items:center; gap:8px; margin-top:8px}
.가성비막대{flex:1; max-width:170px; height:6px; border-radius:4px;
            background:var(--줄무늬); overflow:hidden}
.가성비막대 i{display:block; height:100%; background:linear-gradient(90deg,#2bbfc0,#0d697c)}
.가성비글{font-size:12px; color:var(--연보조); font-weight:700; white-space:nowrap}
.가성비글 b{color:var(--브랜드); font-size:13px}
.숙딱지줄{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.딱지.좋{background:#e8f6ee; color:#1c7a4a}
.딱지.흐림{background:var(--줄무늬); color:var(--연보조)}
.숙단추줄{display:flex; gap:6px; justify-content:flex-end; margin-top:9px; flex-wrap:wrap}
/* 항공 카드에서 [🏨 숙소] 로 넘어왔을 때 위에 붙는 띠 */
.넘어옴{background:var(--브랜드연); border:1px solid #bfe3e8; border-radius:12px;
        padding:11px 14px; margin-bottom:12px; font-size:14px; color:var(--브랜드);
        display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.넘어옴 b{font-weight:800}
.넘어옴 .되돌기{margin-left:auto}
@media (max-width:560px){
  .숙카드{gap:10px}
  .숙사진{width:70px; height:70px}
  .숙값칸{min-width:96px}
  .숙값{font-size:18px}
}

/* 💎 Trip Fit 추천 — 등급 넷을 색으로 가른다.
   🛑 넷을 다 같은 색으로 칠하면 '추천' 이라는 말만 남고 순위가 안 보인다.
      1순위만 눈에 띄게 진하고, 아래로 갈수록 옅어진다. */
.추천딱{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800;
        padding:2px 8px; border-radius:20px; white-space:nowrap}
.추천딱.급1{background:#0d697c; color:#fff}
.추천딱.급2{background:#dff3f5; color:#0b5a6b}
.추천딱.급3{background:#eef4ec; color:#3f6b45}
.추천딱.급4{background:var(--줄무늬); color:var(--보조)}
.추천말{font-size:12px; color:var(--연보조); margin-top:5px; line-height:1.45}
.추천말 b{color:var(--브랜드); font-weight:800}
/* 1순위 카드는 테두리로도 티를 낸다 — 목록을 훑다 눈이 먼저 걸려야 하는 자리다 */
.카드.으뜸{border-color:#0d697c; box-shadow:0 2px 12px rgba(13,105,124,.13)}
/* 기본 정렬이자 이 탭이 내세우는 자 — 칩 하나만 테두리로 티를 낸다 */
.칩.추천칩{border-color:#9ed3da; color:var(--브랜드); font-weight:800}
.칩.추천칩.켬{border-color:var(--브랜드)}
.추천머리{grid-column:1 / -1; display:flex; align-items:center; gap:8px;
          margin:12px 0 7px; font-size:13px; font-weight:800; color:var(--브랜드)}
.추천머리:first-child{margin-top:0}
.추천머리 i{flex:1; height:1px; background:var(--테두리); font-style:normal}
.추천머리 span{font-weight:600; color:var(--연보조); font-size:12px}

/* 어느 집에서 온 값인가 · 두 집 값을 견줘 봤나 */
.곳딱{font-size:11px; font-weight:700; color:var(--연보조);
      background:var(--줄무늬); padding:2px 7px; border-radius:5px}
.견줌{font-size:11.5px; color:var(--보조); margin-top:5px; line-height:1.5}
.견줌 b{color:#1c7a4a; font-weight:800}
.견줌 s{color:var(--연보조)}

/* 종류 칩의 [✕] = 빼기. 고르기(칩 몸통)와 빼기(✕)가 한 칩에 같이 산다 */
.칩.뺀{text-decoration:line-through; opacity:.55}
.칩 .엑스{margin-left:6px; padding:0 3px; border-radius:4px; font-weight:800;
          color:var(--연보조); font-size:11px}
.칩 .엑스:hover{background:#fde8e8; color:var(--빨강)}
.뺀줄{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px;
      color:var(--연보조); margin-top:8px}
.뺀줄 b{color:var(--빨강); font-weight:700}

/* 🏨 숙소 목록도 넓은 화면에서는 **두 칸**으로 깐다 (항공 #목록 과 같은 생각).
   숙소 카드는 [사진|속|값] 세 덩어리라 470px 밑으로 내려가면 값칸이 눌린다 —
   그래서 최소폭을 470px 로 두고, 그게 안 나오면 저 혼자 한 칸으로 돌아간다. */
@media (min-width:901px){
  #숙목록{display:grid; grid-template-columns:repeat(auto-fill,minmax(470px,1fr));
          gap:0 10px; align-items:start}
  #숙목록 > *:not(.카드){grid-column:1 / -1}
  #숙목록 .카드{margin-bottom:8px}
  /* 두 칸일 땐 사진을 조금 줄여 이름이 두 줄로 접히지 않게 한다 */
  #숙목록 .카드{container-type:inline-size}
}
@container (max-width:560px){
  .숙사진{width:78px; height:78px}
  .숙이름{font-size:15.5px}
  .숙값{font-size:19px}
  .숙값칸{min-width:112px}
  .가성비막대{max-width:110px}
}

/* ───────────────────────────────────────────── 준비중 · 모달 */
.준비{background:var(--카드); border:1px solid var(--테두리); border-radius:14px; padding:36px}
.준비 h2{margin:0; font-size:22px}
.준비 p{color:var(--보조); margin:8px 0 0}
.준비 .뱃지{display:inline-block; background:var(--브랜드연); color:var(--브랜드);
            padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; margin:16px 0 18px}
.준비 li{margin:5px 0}
.준비 hr{border:none; border-top:1px solid var(--테두리); margin:22px 0 14px}
.준비 .끝{color:var(--보조); font-size:14px}

.덮개{position:fixed; inset:0; background:rgba(15,20,22,.5); z-index:50;
      display:none; align-items:center; justify-content:center; padding:16px}
.덮개.켬{display:flex}
.상자{background:var(--카드); border-radius:14px; width:min(980px,100%);
      max-height:92vh; display:flex; flex-direction:column; overflow:hidden}
.상자머리{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--테두리)}
.상자머리 b{flex:1; font-size:17px}
.상자속{padding:16px 18px; overflow:auto; flex:1}
.상자밑{padding:12px 18px; border-top:1px solid var(--테두리); display:flex; gap:8px;
        align-items:center; flex-wrap:wrap}
.닫기{background:none; border:none; font-size:22px; color:var(--연보조); line-height:1}

/* 나라 머리 — 도시를 하나씩 열두 번 누르지 않게 [＋ 전부] 를 여기 둔다 */
.곳머리{display:flex; align-items:center; gap:8px; margin:18px 0 8px}
.곳머리:first-child{margin-top:0}
.곳머리 b{font-size:14px; font-weight:800; color:var(--글자)}
.곳머리 .곳수{flex:1; font-size:12px; color:var(--연보조); font-weight:600}
.지역단추{border:1px solid var(--진테두리); background:#fff; color:var(--보조);
          padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; white-space:nowrap}
.지역단추:hover{border-color:var(--브랜드밝); color:var(--브랜드)}
.지역단추.켬{background:var(--브랜드); border-color:var(--브랜드); color:#fff}
.곳고르기{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
.곳{display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:8px;
    border:1px solid var(--테두리); font-size:14px; cursor:pointer; background:#fff}
.곳.켬{background:var(--브랜드연); border-color:var(--브랜드밝); color:var(--브랜드); font-weight:700}

/* ─────────────────── 여행객 (몇 명 · 몇 살 · 어떤 자리)
   <select> 두 개로는 **나이를 물을 자리가 없다**. 창 하나로 빼서
   어른·유소아를 ＋－ 로 세고, 유소아는 몇 살인지까지 받는다
   (만 2세 미만은 요금 체계가 아예 다르다 — 예약 화면이 그걸 알아야 한다). */
.사람단추{width:100%; text-align:left; padding:10px 12px; font-size:14px}
.사람줄{display:flex; align-items:center; gap:12px; padding:14px 2px;
        border-top:1px solid var(--테두리)}
.사람줄.첫{border-top:none; padding-top:4px}
.사람글{flex:1; min-width:0}
.사람글 b{display:block; font-size:15px; font-weight:800}
.사람글 span{display:block; font-size:12px; color:var(--연보조); margin-top:2px}
.셈{display:flex; align-items:center; gap:12px; flex:none}
.셈 button{width:38px; height:38px; border-radius:10px; border:1px solid var(--진테두리);
           background:#fff; font-size:19px; font-weight:700; color:var(--글자); line-height:1}
.셈 button:hover:not(:disabled){border-color:var(--브랜드밝); color:var(--브랜드)}
.셈 button:disabled{color:#c9d2d4; background:var(--배경); border-color:var(--테두리);
                    cursor:default}
.셈 b{min-width:18px; text-align:center; font-size:16px; font-weight:800}
.나이칸{background:var(--배경); border-radius:11px; padding:12px; margin:2px 0 4px}
.나이줄{display:flex; align-items:center; gap:10px; margin-top:8px}
.나이줄:first-child{margin-top:0}
.나이줄 span{flex:1; font-size:13px; color:var(--보조); font-weight:600}
.나이줄 select{width:auto; flex:none; min-width:132px; padding:7px 9px}
.사람말{color:var(--연보조); font-size:12px; line-height:1.6; margin:14px 0 0}

/* ─────────────────── 달력 (가는 날·오는 날을 한 번에)
   폰에서 input[type=date] 두 개는 달력이 두 번 뜬다. 한 번에 끝내려고 직접 그린다. */
.날짜단추{width:100%; text-align:left; padding:10px 12px; font-size:14px}

/* 고른 날짜 — 달력 위에 붙박이 (달력을 내려도 늘 보인다) */
.달머리{display:flex; align-items:stretch; gap:8px; padding:12px 18px 10px}
.달칸{flex:1; min-width:0; border:1.5px solid var(--진테두리); border-radius:11px;
      padding:8px 11px; background:#fff; transition:border-color .15s, background .15s}
.달칸.차례{border-color:var(--브랜드); background:var(--브랜드연)}
.달칸 span{display:block; font-size:11px; color:var(--연보조); font-weight:600}
.달칸 b{display:block; font-size:15px; font-weight:800; letter-spacing:-.3px;
        color:var(--글자); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.달칸.빔 b{color:var(--연보조); font-weight:600}
.달사이{display:flex; align-items:center; justify-content:center; flex:none; width:52px}
.달사이 i{font-style:normal; font-size:12px; font-weight:800; color:var(--브랜드);
          background:var(--브랜드연); border-radius:20px; padding:3px 9px; white-space:nowrap}
.달요일{padding:6px 18px 0; border-top:1px solid var(--테두리)}

.달{margin-bottom:18px}
.달이름{font-size:14px; font-weight:800; text-align:center; margin-bottom:9px}
.요일,.날들{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.요일 span{text-align:center; font-size:11px; color:var(--연보조); padding-bottom:5px}
.요일 span:first-child{color:#d0555b}
.날들 button{aspect-ratio:1/1; border:none; background:none; border-radius:10px;
             font-size:14px; font-weight:600; color:var(--글자); padding:0}
.날들 button:disabled{color:#d3dcde}
.날들 button:not(:disabled):hover{background:var(--줄무늬)}
.날들 .사이{background:var(--브랜드연); border-radius:0; color:var(--브랜드)}
.날들 .시,.날들 .끝{background:var(--브랜드); color:#fff}
.날들 .시{border-radius:10px 0 0 10px}
.날들 .끝{border-radius:0 10px 10px 0}
.날들 .시.홀,.날들 .시.끝{border-radius:10px}

.알림{padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:10px; display:none}
.알림.좋{background:#e8f6ee; color:#1c7a4a; display:block}
.알림.나쁨{background:#fdecea; color:#b32d1f; display:block; white-space:pre-wrap}

/* ───────────────────────────────────────────── 넓은 화면 (PC) — 8/10 개편
   예전엔 카드 한 장이 일곱 줄이었다. 도시·날짜는 왼쪽 끝, 값과 잔줄(평소·백분위·확인)은
   오른쪽 끝에 세로로 쌓여서 **가운데가 통째로 비고** 한 화면에 세 장밖에 안 들어갔다.
   그래서 오른쪽에 쌓여 있던 잔줄을 그 빈 가운데로 눕히고, 화면이 넓으면 **두 칸으로 깐다**.
     1칸(≤1540px) : 한 줄짜리 납작한 카드 75px
     2칸(1560px~) : 두 줄짜리 카드 105px × 두 개  → 1900px 에서 한 화면 12장 (예전 3장)
   값칸은 폭을 고정해서 값이 아래로 쭉 한 줄에 맞춰진다 (눈으로 훑을 때 이게 제일 크다).
   🛑 이 블록은 901px 이상에서만 돈다 — 폰(≤900px)은 한 줄도 안 건드렸다.
      옛 구조/새 구조를 나란히 그려 요소 33개의 좌표를 대 봤고 **다른 곳 0개**였다. */
@media (min-width:901px){
  /* 화면이 넓으면 카드를 두 칸으로 깐다 — 600px 이 안 나오면 저 혼자 한 칸으로 돌아간다.
     [＋더 보기]·[빈 화면] 같은 카드 아닌 것들은 칸을 가로질러 통째로 눕힌다. */
  #목록{display:grid; grid-template-columns:repeat(auto-fill,minmax(600px,1fr));
        gap:0 10px; align-items:start}
  #목록 > *:not(.카드){grid-column:1 / -1}

  /* 🛑 카드는 **자기 폭**을 보고 배치를 고른다 (화면 폭이 아니라).
     1칸이면 넓으니 한 줄, 2칸이면 좁으니 두 줄 — 아래 @container 가 그 갈림길이다. */
  .카드{padding:11px 14px 11px 16px; margin-bottom:7px; container-type:inline-size}
  .카드머리{align-items:center; gap:6px 14px}

  /* 도시·날짜 쪽을 조금 더 넓게 가져간다 — 좁으면 제목이 두 줄로 접혀 카드가 도로 커진다 */
  .카드왼{flex:1.35 1 260px}
  .도시{font-size:18px}
  .나라{margin-left:6px}
  .딱지{font-size:11px; padding:2px 8px; margin-left:6px; vertical-align:2px}
  .줄정보{font-size:13px; margin-top:3px}

  /* 오른쪽 덩어리 = [잔줄들] [값] 이 나란히 눕는다 */
  .카드오{display:flex; align-items:center; justify-content:flex-end;
          flex:1 1 380px; min-width:0; gap:14px}
  .카드메타{display:flex; order:1; flex:1 1 auto; min-width:0;
            flex-wrap:wrap; align-items:center; justify-content:flex-end;
            gap:2px 9px; text-align:left}
  .카드메타 .평소{margin-top:0; white-space:nowrap}
  .카드메타 .확인{margin-top:0; max-width:none; padding:3px 8px}
  .카드메타 .확인.아직{padding:3px 0}

  .값칸{display:block; order:2; flex:none; width:172px}
  .값{font-size:21px}
  .값밑{margin-top:1px}
  .별{font-size:18px; vertical-align:-1px}

  /* [상세보기] 도 같은 줄로 — 예전엔 이것 하나 때문에 줄이 통째로 하나 더 있었다.
     단추 둘을 세로로 쌓아 폭을 안 늘린다 (넓은 화면에선 오른쪽 칸이 좁다) */
  .살줄{flex:0 0 auto; width:98px; margin-top:0; flex-direction:column; align-items:flex-end}
  .살버튼{padding:4px 9px; font-size:12px}
  .살곳{margin-top:10px; padding-top:9px}

  /* ── 카드가 좁을 때(=2칸으로 깔렸을 때) — 한 줄로는 안 되니 두 줄로 접는다
        [도시 · 딱지        ]  [★ 123,247원]
        [날짜 · 직항 · 항공사]  [   1인 왕복 ]
        [평소 · 싼날 · 확인줄]  [   상세보기 ]   ← 오른쪽 칸은 값·단추가 같은 선에 선다
     🛑 @container 를 못 알아듣는 브라우저는 이 블록을 통째로 건너뛰고 위의 한 줄 배치로 간다
        (좁아서 답답할 뿐, 깨지지는 않는다). */
  @container (max-width:780px){
    .카드머리{display:grid; align-items:center; gap:5px 12px;
              grid-template-columns:minmax(0,1fr) auto;
              grid-template-areas:"왼 값" "메타 살"}
    .카드오{display:contents}              /* 값칸·카드메타를 격자에 직접 놓는다 */
    .카드왼{grid-area:왼}
    .값칸{grid-area:값; text-align:right}

.여정줄{display:flex; gap:8px; margin-bottom:13px}

/* 며칠 다녀오나 — 날짜 창에서 고른다. '*' 는 '며칠이든'(박수 상관없음) */
let 박칸 = '*';
/* 여행객 — 나이(아이나이)는 사람 수만큼 들어간다. 만 2세 미만이면 유아 요금이다.
   창에서 [완료]를 눌러야 여기에 들어온다 (임시객 → 여행객). */
let 여행객 = {성인: 1, 아이나이: [], 좌석: '일반석'}, 임시객 = null;
const 최대여행객 = 9, 기본아이나이 = 8;
let 줄들 = [], 보임 = [], 담은 = [], 지금작업 = null, 끝난작업 = null, 도는중 = false;
/* 🛑 기본은 '싼 순'이다 — 싼 표를 찾으러 온 사람에게 특가율부터 들이밀지 않는다 */
let 지역값 = '*', 달값 = '*', 박값 = '*', 정렬값 = '값', 보이는수 = 30, 펼친 = null;
const 살곳색 = {네이버: '#03C75A', 구글: '#4285F4', 스카이스캐너: '#0770E3',
                카약: '#FF690F', 트립닷컴: '#2681FF', 키위: '#00A991',
                직판: '#E8590C'};
/* 단추에 한 자만 적는다. 직판은 "제주항공 직판" 처럼 항공사 이름이 앞에 붙어 오니
   뒤의 ' 직판' 을 보고 한 칸으로 모은다 (색·글자를 항공사마다 따로 두지 않는다). */
const 살곳글자 = {네이버: '네', 구글: '구', 스카이스캐너: '스',
                  카약: '카', 트립닷컴: '트', 키위: '키', 직판: '직'};
const 살곳키 = k => (k.endsWith(' 직판') ? '직판' : k);
let 지역항목 = [], 지역펼침 = true, 지역타이머 = null;
let 마지막글 = '';

const 탭들 = [['항공권', '항공권'], ['숙소', '숙박'], ['BEST', '베스트']];

/* ─────────────────────────────────────────── 시작 */
async function 시작() {
  탭그리기();
  /* 미리 찾아 둔 값으로 도는 공개 사이트에서는 대표용 도구(★·콘텐츠)를 감춘다 —
     눌러도 안 되는 단추는 손님 눈에 '고장'으로 보인다. (정적shim.js 가 표시를 남긴다) */
  if (window.TF미리찾음) document.body.classList.add('손님용');
  try {
    메타 = await (await fetch(밑 + 'api/meta')).json();
  } catch (e) { $('#상태').textContent = '자료를 불러오지 못했습니다.'; return; }

  const 출발칸 = 메타.출발지.map(x => `<option>${홑(x)}</option>`).join('');
  $('#출발지').innerHTML = 출발칸;
  $('#베출발지').innerHTML = 출발칸;
  여행객.좌석 = (메타.좌석 || []).includes(여행객.좌석) ? 여행객.좌석 : (메타.좌석 || ['일반석'])[0];
  $('#예산').innerHTML = ['상관없음','20만원 이하','30만원 이하','40만원 이하','50만원 이하',
                          '70만원 이하','100만원 이하'].map(x => `<option>${홑(x)}</option>`).join('');
  const 이레뒤 = 날더하기(메타.오늘, 7);
  $('#시작날').value = 이레뒤;
  $('#끝날').value  = 날더하기(이레뒤, 2);
  ['#출발지','#예산','#직항만','#주말만'].forEach(s =>
    $(s).addEventListener('change', 요약갱신));
  빈화면();
  요약갱신();

  /* 들어올 때 #숙박 이었으면 지금탭 은 이미 '숙박' 이다(맨 밑 첫자리잡기 참고). */
  if (지금탭 !== '항공권') {
    자리되돌림 = true;                       // 첫 화면이니 자리를 새로 쌓지 않는다
    try { 탭보이기(지금탭); } finally { 자리되돌림 = false; }
  }
}

function 탭그리기() {
  $('#탭줄').innerHTML = 탭들.map(([g, v]) =>
    `<button class="탭${v === 지금탭 ? ' 켬' : ''}" data-v="${v}">${g}</button>`).join('');
  $('#탭줄').querySelectorAll('.탭').forEach(b => b.onclick = () => 탭보이기(b.dataset.v));
}

function 탭보이기(v) {
  const 전탭 = 지금탭;
  지금탭 = v; 탭그리기();
  // 탭이 바뀌면 히스토리에 자리를 하나 쌓는다 → 브라우저 ← 가 '전 탭'이 된다
  if (!자리되돌림 && v !== 전탭) 자리쌓기({곳: '탭', 탭: v});
  const 항공 = (v === '항공권'), 숙박 = (v === '숙박'), 베스트 = (v === '베스트');
  $('#항공권쪽').style.display = 항공 ? 'block' : 'none';
  $('#숙박쪽').style.display   = 숙박 ? 'block' : 'none';
  $('#베스트쪽').style.display = 베스트 ? 'block' : 'none';
  $('#항공폼').style.display   = 항공 ? 'block' : 'none';
  $('#숙박폼').style.display   = 숙박 ? 'block' : 'none';
  $('#베스트폼').style.display = 베스트 ? 'block' : 'none';
  if (숙박) 숙박깨우기();
  if (베스트) 베스트깨우기();
}

/* ─────────────────────────────────────────── 조건 칸 */
function 칩그리기(자리, 항목, 지금, 골랐을때) {
  const 그리기 = () => {
    $(자리).innerHTML = 항목.map(([글, 값], i) =>
      `<button class="칩${JSON.stringify(값) === JSON.stringify(지금()) ? ' 켬' : ''}"
        data-i="${i}">${홑(글)}</button>`).join('');
    $(자리).querySelectorAll('.칩').forEach(b => b.onclick = () => {
      골랐을때(항목[+b.dataset.i][1]); 그리기();
    });
  };
  그리기();
}

function 조건접기(펼침) { /* 옛 왼쪽 기둥의 접기 — 검색 칸이 위로 올라와 할 일이 없다 */ }
function 자세히접기() {
  자세히펼침 = !자세히펼침;
  $('#자세히').style.display = 자세히펼침 ? 'block' : 'none';
  $('#자세히머리').textContent = '세부 조건 ' + (자세히펼침 ? '▴' : '▾');
}
function 숙자세히접기() {
  const 켬 = $('#숙자세히').style.display !== 'block';
  $('#숙자세히').style.display = 켬 ? 'block' : 'none';
  $('#숙자세히머리').textContent = '세부 조건 ' + (켬 ? '▴' : '▾');
}
function 여정바꾸기(편도) {
  $('#편도').checked = !!편도;
  $('#여정왕복').classList.toggle('켬', !편도);
  $('#여정편도').classList.toggle('켬', !!편도);
  $('#항공폼').classList.toggle('편도', !!편도);
  요약갱신();
}

/* ── '며칠 다녀와요?' 는 없앴다. 날짜를 고르면 거기서 박수가 나오고,
      기간(3개월 안 …)으로 찾을 땐 **며칠이든 다 본다**.
      🛑 여기를 [2,2] 로 뒀다가 "한 달 안"이 죄다 2박만 나오는 사고를 냈다.
         네이버는 tripDays 를 **리스트 하나로** 받는다 — 넓혀도 요청 수는 그대로다. */
const 기본박 = [1, 10];
function 날더하기(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1, d + n), p = x => String(x).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}
function 날수(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
}
function 정한날() {                    // [가는날, 오는날, 박] — 안 정했으면 null
  if (언제값 !== '직접') return null;
  const 시 = $('#시작날').value, 끝 = $('#끝날').value;
  if (!시 || !끝) return null;
  const 박 = 날수(시, 끝);
  return (박 >= 1 && 박 <= 30) ? [시, 끝, 박] : null;
}
/* 며칠 다녀오나. 🛑 여기 값은 공장이 미리 훑어 둔 **박 버킷과 1:1** 이어야 한다 —
   어긋나면 손님은 "찾았는데 아무것도 없다"만 보고 이유를 모른다. */
const 박칸값 = {'0': [0, 0], '1': [1, 1], '2': [2, 2], '3': [3, 3],
                '4-6': [4, 6], '6-8': [6, 8], '*': 기본박};
function 며칠값() {
  const 정 = 정한날();
  return 정 ? [정[2], 정[2]] : (박칸값[박칸] || 기본박);
}

/* ── 달력 하나로 가는 날·오는 날을 한 번에 (첫 번째 누름 = 가는 날, 두 번째 = 오는 날) */
let 임시시 = '', 임시끝 = '';
let 달모드값 = '유연', 임시기간 = '석달', 임시박 = '*';
const 기간항목 = [['2주 이내', '2주'], ['1개월 이내', '한달'],
                  ['3개월 이내', '석달'], ['6개월 이내', '여섯달']];
const 항공박항목 = [['당일치기', '0'], ['1박', '1'], ['2박', '2'], ['3박', '3'],
                    ['4~6박', '4-6'], ['일주일', '6-8'], ['며칠이든', '*']];
const 숙박박항목 = [['1박', '1'], ['2박', '2'], ['3박', '3'], ['5박', '5'], ['7박', '7']];

function 기간글(값) { const 짝 = 기간항목.find(x => x[1] === 값); return 짝 ? 짝[0] : '6개월 이내'; }
function 박글(값) { const 짝 = 항공박항목.find(x => x[1] === String(값)); return 짝 ? 짝[0] : '며칠이든'; }
function 긴날(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${m}월 ${d}일 (${'일월화수목금토'[new Date(y, m - 1, d).getDay()]})`;
}

function 달력열기(갈래) {
  모달갈래 = 갈래 || '항공';
  if (모달갈래 === '숙박') {
    임시시 = 숙시작; 임시끝 = 숙끝;
    임시기간 = (숙언제값 === '직접') ? '한달' : 숙언제값; 임시박 = String(숙박값);
    달모드값 = (숙언제값 === '직접' && 숙시작) ? '지정' : '유연';
  } else if (모달갈래 === '베스트') {
    임시시 = 베시작; 임시끝 = 베끝;
    임시기간 = (베언제값 === '직접') ? '여섯달' : 베언제값; 임시박 = String(베박값);
    달모드값 = (베언제값 === '직접' && 베시작) ? '지정' : '유연';
  } else {
    임시시 = (언제값 === '직접') ? ($('#시작날').value || '') : '';
    임시끝 = (언제값 === '직접') ? ($('#끝날').value || '') : '';
    임시기간 = (언제값 === '직접') ? '여섯달' : 언제값; 임시박 = 박칸;
    달모드값 = (언제값 === '직접') ? '지정' : '유연';
  }
  달창그리기(); 열기('달덮개');
  // 골라 둔 달이 바로 보이게 (안 그러면 늘 첫 달부터 내려야 한다)
  const 속 = $('#달속');
  const 달 = 임시시 && 속.querySelector(`.달[data-ym="${임시시.slice(0, 7)}"]`);
  속.scrollTop = 달 ? Math.max(0, 달.offsetTop - 속.offsetTop - 6) : 0;
}

function 달모드(m) { 달모드값 = m; 달창그리기(); }

function 달창그리기() {
  const 숙 = (모달갈래 !== '항공');
  $('#달제목').textContent = 숙 ? '숙박 일정' : '여행 일정';
  $('#모드유연').classList.toggle('켬', 달모드값 === '유연');
  $('#모드지정').classList.toggle('켬', 달모드값 === '지정');
  $('#유연칸').style.display = (달모드값 === '유연') ? '' : 'none';
  $('#지정칸').style.display = (달모드값 === '지정') ? '' : 'none';
  $('#달지움').style.display = (달모드값 === '지정') ? '' : 'none';
  if (달모드값 === '유연') 유연그리기(); else 달력그리기();
  달확인갱신();
}

function 유연그리기() {
  const 편도 = (모달갈래 === '항공') && $('#편도').checked;
  $('#기간칩').innerHTML = 기간항목.map(([g, v]) =>
    `<button class="칩${v === 임시기간 ? ' 켬' : ''}" data-v="${v}">${g}</button>`).join('');
  $('#기간칩').querySelectorAll('.칩').forEach(b =>
    b.onclick = () => { 임시기간 = b.dataset.v; 유연그리기(); });

  $('#며칠고르기').style.display = 편도 ? 'none' : '';
  const 항목 = (모달갈래 === '항공') ? 항공박항목 : 숙박박항목;
  if (!항목.some(x => x[1] === 임시박)) 임시박 = (모달갈래 === '항공') ? '*' : '2';
  $('#박수칩').innerHTML = 항목.map(([g, v]) =>
    `<button class="칩${v === 임시박 ? ' 켬' : ''}" data-v="${v}">${g}</button>`).join('');
  $('#박수칩').querySelectorAll('.칩').forEach(b =>
    b.onclick = () => { 임시박 = b.dataset.v; 유연그리기(); });
}
function 달력그리기() {
  const 오늘 = 메타.오늘;
  const [y0, m0] = 오늘.split('-').map(Number);
  let h = '';
  for (let k = 0; k < 7; k++) {                       // 오늘 달부터 일곱 달
    const d = new Date(y0, m0 - 1 + k, 1);
    h += 달하나(d.getFullYear(), d.getMonth() + 1, 오늘);
  }
  $('#달속').innerHTML = h;
  $('#달속').querySelectorAll('.날들 button[data-d]').forEach(b =>
    b.onclick = () => 날눌림(b.dataset.d));
  달확인갱신();
}
function 달하나(y, m, 오늘) {
  const 첫 = new Date(y, m - 1, 1).getDay(), 끝일 = new Date(y, m, 0).getDate();
  let 칸 = '<span></span>'.repeat(첫);
  for (let d = 1; d <= 끝일; d++) {
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const 지남 = iso < 오늘;
    const 시 = iso === 임시시, 끝 = iso === 임시끝;
    const 사이 = 임시시 && 임시끝 && iso > 임시시 && iso < 임시끝;
    const 결 = [시 && '시', 끝 && '끝', 사이 && '사이', 시 && !임시끝 && '홀']
                 .filter(Boolean).join(' ');
    칸 += `<button class="${결}" ${지남 ? 'disabled' : `data-d="${iso}"`}>${d}</button>`;
  }
  // 요일 줄은 달마다 안 그린다 — 상자 위에 붙박이로 하나만 있다
  return `<div class="달" data-ym="${y}-${String(m).padStart(2, '0')}">
    <div class="달이름">${y}년 ${m}월</div>
    <div class="날들">${칸}</div></div>`;
}
function 날눌림(iso) {
  if (!임시시 || 임시끝 || iso <= 임시시) { 임시시 = iso; 임시끝 = ''; }
  else 임시끝 = iso;
  달력그리기();
}
function 달지우기() { 임시시 = ''; 임시끝 = ''; 달력그리기(); 달확인갱신(); }

/* 창 아래 [적용] 과 위쪽 두 칸(가는 날·오는 날)의 상태를 한 자리에서 맞춘다.
   🛑 편도는 '오는 날' 없이도 적용된다 — 없는 칸을 기다리면 단추가 영영 안 켜진다. */
function 달확인갱신() {
  const 편도 = (모달갈래 === '항공') && $('#편도').checked;
  const 다 = !!(임시시 && (편도 || 임시끝));
  $('#달확인').disabled = (달모드값 === '지정') && !다;
  $('#달확인').textContent = (달모드값 === '유연') ? '적용'
    : (다 ? '적용' : (임시시 ? (편도 ? '적용' : '오는 날을 골라주세요') : '가는 날을 골라주세요'));
  if (달모드값 !== '지정') return;
  const 숙 = (모달갈래 !== '항공');
  $('#달칸시 span').textContent = 숙 ? '체크인' : '가는 날';
  $('#달칸끝 span').textContent = 숙 ? '체크아웃' : '오는 날';
  $('#달시').textContent = 임시시 ? 짧은날(임시시) : '눌러주세요';
  $('#달끝').textContent = 임시끝 ? 짧은날(임시끝) : (임시시 ? '눌러주세요' : '—');
  $('#달박').textContent = (임시시 && 임시끝) ? `${날수(임시시, 임시끝)}박` : '—';
  // 지금 고를 차례인 칸을 켜 둔다 — 어디를 눌러야 하는지 눈으로 알게
  $('#달칸시').className = '달칸' + (임시시 ? '' : ' 차례 빔');
  $('#달칸끝').className = '달칸' + (임시끝 ? '' : (임시시 ? ' 차례 빔' : ' 빔'));
}
function 달정하기() {
  const 편도 = (모달갈래 === '항공') && $('#편도').checked;
  if (달모드값 === '지정') {
    if (!임시시 || (!편도 && !임시끝)) return;
    const 끝 = 임시끝 || 임시시;
    if (모달갈래 === '숙박')      { 숙언제값 = '직접'; 숙시작 = 임시시; 숙끝 = 끝; }
    else if (모달갈래 === '베스트') { 베언제값 = '직접'; 베시작 = 임시시; 베끝 = 끝; }
    else { 언제값 = '직접'; $('#시작날').value = 임시시; $('#끝날').value = 끝; }
  } else {
    if (모달갈래 === '숙박')      { 숙언제값 = 임시기간; 숙박값 = +임시박; 숙시작 = ''; 숙끝 = ''; }
    else if (모달갈래 === '베스트') { 베언제값 = 임시기간; 베박값 = +임시박; 베시작 = ''; 베끝 = ''; }
    else { 언제값 = 임시기간; 박칸 = 임시박; }
  }
  닫기('달덮개');
  if (모달갈래 === '숙박') 숙요약갱신();
  else if (모달갈래 === '베스트') 베필드갱신();
  else 요약갱신();
}
function 짧은날(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${m}/${d}(${'일월화수목금토'[new Date(y, m - 1, d).getDay()]})`;
}

function 목적지글() {
  if (!고른곳.size) return '어디든지';
  const 목 = [...고른곳];
  return 목.length <= 2 ? 목.join(' · ') : `${목[0]} 외 ${목.length - 1}곳`;
}
function 언제글() {
  const 정 = 정한날();
  return 정 ? `${짧은날(정[0])} → ${짧은날(정[1])}` : 기간글(언제값);
}
function 며칠글() {
  const 정 = 정한날();
  return 정 ? `${정[2]}박 ${정[2] + 1}일` : 박글(박칸);
}
function 조건말() {
  const 편도 = $('#편도').checked;
  const 정 = 정한날();
  /* 혼자·일반석이면 굳이 안 쓴다 — 손댄 사람에게만 보인다 */
  const 기본객 = (여행객.성인 === 1 && !여행객.아이나이.length
                && 여행객.좌석 === ((메타.좌석 || ['일반석'])[0]));
  return `${$('#출발지').value} → ${목적지글()}\n`
       + `${언제글()}${정 ? '' : ' 출발'} · ${편도 ? '편도' : 며칠글()}`
       + (기본객 ? '' : `\n${사람글()} · ${여행객.좌석}`);
}
function 요약갱신() {
  $('#목적지버튼').querySelector('b').textContent = 목적지글();
  const 직접 = (언제값 === '직접');
  $('#언제칸글').textContent = (직접 && $('#시작날').value) ? 긴날($('#시작날').value)
                                                          : 기간글(언제값);
  $('#며칠칸글').textContent = (직접 && $('#끝날').value) ? 긴날($('#끝날').value)
                                                        : 박글(박칸);
  사람단추갱신();
}

/* 목적지 고르기 — 항공·숙박이 **같은 창**을 쓴다.
   🛑 어느 탭이 열었는지(모달갈래)를 안 기억하면 숙박에서 고른 도시가
      항공 조건으로 들어간다. 열 때 적어 두고 [이걸로] 에서 그대로 읽는다. */
let 모달갈래 = '항공';
function 곳고르기열기(갈래) {
  모달갈래 = 갈래 || '항공';
  임시곳 = new Set(모달갈래 === '숙박' ? 숙고른곳 : 고른곳);
  곳목록그리기();
  열기('곳덮개');
}
function 곳목록그리기() {
  const 지역별 = {};
  (모달갈래 === '숙박' ? (숙메타.도시 || []) : 메타.목적지)
    .forEach(c => (지역별[c.지역] = 지역별[c.지역] || []).push(c));
  const 묶음 = Object.entries(지역별);
  const 속 = $('#곳덮개 .상자속');
  const 스크롤 = 속 ? 속.scrollTop : 0;               // 나라 단추를 눌러도 자리를 안 잃게

  $('#곳목록').innerHTML = 묶음.map(([g, 곳들], gi) => {
    const 켠수 = 곳들.filter(c => 임시곳.has(c.이름)).length;
    const 다 = 켠수 === 곳들.length;
    return `<div class="곳머리">
        <b>${홑(g)}</b>
        <span class="곳수">${켠수 ? `${켠수} / ${곳들.length}곳` : `${곳들.length}곳`}</span>
        <button class="지역단추${다 ? ' 켬' : ''}" data-g="${gi}">${다 ? '✔ 전부 빼기' : '＋ 전부'}</button>
      </div>
      <div class="곳고르기">${곳들.map(c =>
        `<button class="곳${임시곳.has(c.이름) ? ' 켬' : ''}" data-n="${홑(c.이름)}">
           <span>${임시곳.has(c.이름) ? '✔' : '＋'}</span>${홑(c.이름)}</button>`).join('')}</div>`;
  }).join('');

  $('#곳목록').querySelectorAll('.곳').forEach(b => b.onclick = () => {
    const n = b.dataset.n;
    if (임시곳.has(n)) 임시곳.delete(n); else 임시곳.add(n);
    곳목록그리기();                       // 나라 머리의 '3 / 12곳' 도 같이 따라가야 한다
  });
  // 나라 하나를 통째로 — 하나씩 열두 번 누르게 두지 않는다
  $('#곳목록').querySelectorAll('.지역단추').forEach(b => b.onclick = () => {
    const 곳들 = 묶음[+b.dataset.g][1];
    const 다 = 곳들.every(c => 임시곳.has(c.이름));
    곳들.forEach(c => 다 ? 임시곳.delete(c.이름) : 임시곳.add(c.이름));
    곳목록그리기();
  });
  if (속) 속.scrollTop = 스크롤;
  곳센다();
}
function 곳센다() {
  const n = 임시곳.size, 최대 = 메타.최대목적지 || 25;
  const e = $('#곳센다');
  const 넘침 = n > 최대;
  e.textContent = 넘침 ? `${n}곳 — 한 번에 ${최대}곳까지만 됩니다`
    : (n ? `${n}곳 선택` : '선택하지 않으면 전체에서 찾습니다');
  e.style.color = 넘침 ? 'var(--빨강)' : '';
  e.style.fontWeight = 넘침 ? '700' : '';
  const 확 = $('#곳덮개 .큰버튼');
  if (확) 확.disabled = 넘침;
}
function 곳전부끄기() { 임시곳.clear(); 곳목록그리기(); }
function 곳정하기() {
  if (모달갈래 === '숙박') { 숙고른곳 = new Set(임시곳); 닫기('곳덮개'); 숙요약갱신(); return; }
  고른곳 = new Set(임시곳); 닫기('곳덮개'); 요약갱신();
}

/* ─────────────────────────────────────────── 여행객 (몇 명 · 몇 살 · 어떤 자리)
   나이를 왜 받나: 만 2세 미만은 **유아**(무릎 위)라 값이 아예 다르고,
   2~11세는 소아 요금이 따로 있다. 예약 화면에 그대로 넘겨야 헛값을 안 본다. */
const 유아나이 = 2;                                   // 만 2세 미만 = 유아
const 유아수 = 객 => 객.아이나이.filter(n => n < 유아나이).length;
const 소아수 = 객 => 객.아이나이.filter(n => n >= 유아나이).length;

function 사람글() {
  const 아이 = 여행객.아이나이.length;
  return `성인 ${여행객.성인}명` + (아이 ? ` · 유/소아 ${아이}명` : '');
}
function 사람단추갱신() {
  const b = $('#사람단추');
  if (b) b.textContent = `여행객 ${여행객.성인 + 여행객.아이나이.length}명`;
}

function 사람고르기열기(갈래) {
  모달갈래 = 갈래 || '항공';
  const 원 = (모달갈래 === '숙박') ? 숙객 : (모달갈래 === '베스트') ? 베객 : 여행객;
  임시객 = {성인: 원.성인, 아이나이: [...원.아이나이], 좌석: 여행객.좌석};
  사람그리기();
  열기('사람덮개');
}

function 사람세기(누구, 몇) {
  const 합 = 임시객.성인 + 임시객.아이나이.length;
  if (몇 > 0 && 합 >= 최대여행객) return;
  if (누구 === '성인') 임시객.성인 = Math.max(1, Math.min(최대여행객, 임시객.성인 + 몇));
  else if (몇 > 0) 임시객.아이나이.push(기본아이나이);
  else 임시객.아이나이.pop();
  사람그리기();
}
function 나이바꿈(i, v) { 임시객.아이나이[i] = parseInt(v); 사람그리기(); }

function 사람그리기() {
  const 아이 = 임시객.아이나이.length, 합 = 임시객.성인 + 아이;
  const 꽉 = 합 >= 최대여행객;
  const 숙 = (모달갈래 !== '항공');       // 숙소·BEST 는 '방에 몇 명' 이다

  $('#사람덮개 .상자머리 b').textContent = 숙 ? '인원' : '여행객';

  $('#좌석칩').innerHTML = (메타.좌석 || ['일반석']).map(x =>
    `<button class="칩${x === 임시객.좌석 ? ' 켬' : ''}" data-v="${홑(x)}">${홑(x)}</button>`).join('');
  $('#좌석칩').querySelectorAll('.칩').forEach(b =>
    b.onclick = () => { 임시객.좌석 = b.dataset.v; 사람그리기(); });

  $('#어른수').textContent = 임시객.성인;
  $('#아이수').textContent = 아이;
  $('#어른뺌').disabled = 임시객.성인 <= 1;
  $('#아이뺌').disabled = 아이 <= 0;
  $('#어른더').disabled = $('#아이더').disabled = 꽉;

  const 칸 = $('#나이칸');
  칸.style.display = 아이 ? 'block' : 'none';
  if (아이) {
    칸.innerHTML = 임시객.아이나이.map((나, i) => `
      <div class="나이줄"><span>${i + 1}번째 아이 나이</span>
        <select data-i="${i}">${[...Array(18).keys()].map(n =>
          `<option value="${n}"${n === 나 ? ' selected' : ''}>${
            n < 유아나이 ? `${n}세 (유아)` : `${n}세`}</option>`).join('')}</select></div>`).join('');
    칸.querySelectorAll('select').forEach(s =>
      s.onchange = () => 나이바꿈(+s.dataset.i, s.value));
  }

  if (숙) {
    // 숙박은 **방 하나에 몇 명**이냐다. 유아 무릎 규칙도, 어른 1명 값도 여기선 없다.
    $('#사람말').innerHTML = '방 <b>1개</b> 기준입니다. 아이 나이는 아고다가 '
      + '<b>무료 투숙 나이</b>를 따지는 데 씁니다.'
      + (꽉 ? `<br>한 방에 ${최대여행객}명까지 찾을 수 있습니다.` : '');
    const 확숙 = $('#사람덮개 .큰버튼');
    if (확숙) 확숙.disabled = false;
    return;
  }

  /* 🛑 값이 어떻게 매겨지는지는 숨기지 않는다 — 카드값은 늘 어른 1명 값이다 */
  const 유 = 유아수(임시객), 소 = 소아수(임시객), 넘침 = 유 > 임시객.성인;
  /* 🛑 실측(2026-08-09)한 곳만 적는다 — 스카이스캐너·카약은 봇 확인에 막혀 확인 못 했다 */
  let 말 = '카드에 보이는 값은 <b>성인 1명 기준</b>입니다. '
         + '인원·나이는 <b>네이버·트립닷컴</b>으로 예약하러 갈 때 그대로 실려 갑니다 '
         + '(다른 곳은 그 화면에서 인원을 다시 골라주세요).';
  if (유) 말 += `<br>만 ${유아나이}세 미만 ${유}명은 <b>유아(무릎 위)</b> 요금으로 잡힙니다.`;
  if (소) 말 += `<br>${유아나이}~17세 ${소}명은 소아 요금이라 성인과 값이 다릅니다.`;
  if (꽉) 말 += `<br>한 번에 ${최대여행객}명까지 찾을 수 있습니다.`;
  /* 무릎 위 유아는 어른 한 명당 한 명까지다 — 넘으면 예약 화면이 거절한다 */
  if (넘침) 말 += `<br><b style="color:var(--빨강)">만 ${유아나이}세 미만은 성인 수(${
    임시객.성인}명)보다 많을 수 없습니다 — 나이를 고치거나 성인을 늘려주세요.</b>`;
  $('#사람말').innerHTML = 말;
  const 확 = $('#사람덮개 .큰버튼');
  if (확) 확.disabled = 넘침;
}

function 사람정하기() {
  if (모달갈래 === '숙박') {
    숙객 = {성인: 임시객.성인, 아이나이: [...임시객.아이나이]};
    임시객 = null; 닫기('사람덮개'); 숙요약갱신(); return;
  }
  if (모달갈래 === '베스트') {
    베객 = {성인: 임시객.성인, 아이나이: [...임시객.아이나이]};
    임시객 = null; 닫기('사람덮개'); 베필드갱신(); return;
  }
  여행객 = 임시객; 임시객 = null;
  사람단추갱신(); 닫기('사람덮개'); 요약갱신();
}

/* ─────────────────────────────────────────── 찾기 */
function 조건모으기() {
  const 예 = $('#예산').value.replace('만원 이하', '').trim();
  return {
    출발지이름: $('#출발지').value,
    성인: 여행객.성인, 좌석: 여행객.좌석,
    소아: 소아수(여행객), 유아: 유아수(여행객), 아이나이: [...여행객.아이나이],
    예산만원: /^\d+$/.test(예) ? parseInt(예) : 0,
    직항만: $('#직항만').checked, 주말만: $('#주말만').checked,
    편도: $('#편도').checked, 편도조합: $('#편도조합').checked, 오픈조: $('#오픈조').checked,
    언제: 언제값, 직접기간: [$('#시작날').value, $('#끝날').value],
    며칠: 며칠값(), 고른곳: [...고른곳],
  };
}

/* 찾는 동안 보이는 칸. 엔진이 뱉는 수십 줄을 **한 마디**로 줄여서 보여준다
   (줄이 쌓이는 화면은 손님 눈에 '고장'으로 보인다), 다 찾으면 저 혼자 사라진다. */
let 로그폄 = false, 곁말 = '';

function 비행보이기(켬) {
  const e = $('#비행');
  if (켬) {
    e.classList.remove('사라짐');
    e.style.display = 'block';
    $('#찾는말').textContent = '검색을 준비하고 있습니다';
    $('#찾는곁말').textContent = '';
    $('#진행글').textContent = '';
    $('#로그칸').textContent = '';
    $('#막대').style.display = 'block';
    곁말 = '';
    막대(null);
  } else {
    e.classList.add('사라짐');
    setTimeout(() => { if (!도는중) e.style.display = 'none'; }, 480);
  }
}

function 로그토글() {
  로그폄 = !로그폄;
  $('#로그칸').style.display = 로그폄 ? 'block' : 'none';
  $('#자세히단추').textContent = 로그폄 ? '접기' : '진행 자세히';
}

function 안내갱신(일) {
  const 로그 = 일.로그 || [];
  let 말 = '최저가를 확인하고 있습니다', 단위 = '곳';
  for (const l of 로그) {
    if (l.includes('차례를 기다')) 말 = '앞선 검색이 끝나는 대로 시작합니다';
    if (l.includes('싼 순서로')) 말 = '가격이 낮은 지역부터 확인하고 있습니다';
    const 달 = l.match(/(\d+)곳의 달력을 받습니다/);
    if (달) 말 = `${달[1]}개 도시의 날짜를 확인하고 있습니다`;
    if (l.includes('날짜별로 전부 훑습니다')) 말 = '주요 도시를 날짜별로 확인하고 있습니다';
    if (l.includes('전부 봅니다')) 말 = '선택하신 도시를 날짜별로 확인하고 있습니다';
    if (l.includes('맞춰봅니다')) { 말 = '왕복 조합을 맞춰 보고 있습니다'; 단위 = ''; }
    if (l.includes('다시 확인')) { 말 = '실제 판매가를 재확인하고 있습니다'; 단위 = ''; }
    const 값 = l.match(/^\s*(\S+)\s+갈\s+\d+일.*?최저\s+([\d,]+)원/)
            || l.match(/^\s+(\S+)\s+\d+건\s*·\s*최저\s+([\d,]+)원/);
    if (값) 곁말 = `${값[1]} ${값[2]}원 확인`;
  }
  $('#찾는말').textContent = 말;
  $('#찾는곁말').textContent = 곁말;
  // 🛑 한 단계가 끝나면 다음 단계가 숫자를 줄 때까지 '끝/끝' 이 그대로 남는다.
  //    꽉 찬 막대가 안 움직이면 멈춘 걸로 보인다 — 그럴 땐 흐르는 막대로 돌린다.
  const [끝, 총] = 일.진행 || [0, 0];
  if (총 && 끝 < 총) { 막대(끝 / 총); $('#진행글').textContent = `${끝} / ${총}${단위}`; }
  else { 막대(null); $('#진행글').textContent = ''; }
  $('#로그칸').textContent = 로그.join('\n');
  $('#로그칸').scrollTop = $('#로그칸').scrollHeight;
}

async function 찾기() {
  if (도는중) return;
  바쁨(true);
  담은 = []; 펼친 = null; 보이는수 = 30; 지역값 = '*'; 달값 = '*';
  비행보이기(true);
  $('#상태').textContent = '';

  let 답;
  try {
    답 = await (await fetch(밑 + 'api/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(조건모으기())
    })).json();
  } catch (e) { 실패('서버에 연결이 안 됩니다.'); return; }

  if (답.잘못) { 실패(답.잘못); return; }
  if (답.바로) { 끝난작업 = 답.작업 || 끝난작업; 결과받음(답.결과, 답.말); return; }
  지금작업 = 답.작업;
  if (답.앞에 > 0) $('#찾는말').textContent =
    `앞에 ${답.앞에}명이 찾고 있어요 — 곧 시작해요`;
  기다리기();
}

function 기다리기() {
  const 작업 = 지금작업;
  const 돌기 = async () => {
    if (지금작업 !== 작업) return;
    let 일;
    try { 일 = await (await fetch(밑 + 'api/job/' + 작업)).json(); }
    catch (e) { setTimeout(돌기, 1500); return; }
    if (일.잘못) { 실패(일.잘못); return; }
    안내갱신(일);
    if (일.상태 === '끝') { 끝난작업 = 작업; 결과받음(일.결과); return; }
    if (일.상태 === '실패') { 실패(일.말); return; }
    setTimeout(돌기, 900);
  };
  돌기();
}

function 막대(값) {
  const m = $('#막대');
  m.style.display = 'block';
  if (값 === null) { m.classList.add('흐름'); $('#막대속').style.width = ''; }
  else { m.classList.remove('흐름'); $('#막대속').style.width = Math.round(값 * 100) + '%'; }
}
function 바쁨(켬) {
  도는중 = 켬;
  $('#찾기버튼').disabled = 켬;
  $('#찾기버튼').textContent = 켬 ? '검색 중…' : '검색';
}
function 실패(말) {
  바쁨(false); 지금작업 = null;
  $('#비행').style.display = 'none';
  $('#상태').textContent = '✗ ' + 말;
}

function 결과받음(결과, 앞말) {
  바쁨(false); 지금작업 = null;
  비행보이기(false);                    // 다 찾았으니 안내 칸은 스스로 사라진다
  줄들 = 결과.줄 || [];
  const 싼 = 결과.제일싼;
  /* 🛑 '📦 …에 찾아 둔 값입니다' 는 화면 맨 위 띠가 이미 하고 있는 말이다.
     여기서는 그 앞에 붙는 **조건이 바뀌었다는 알림**만 남긴다 (없으면 아무 말도 안 한다). */
  const 알림 = String(앞말 || '').split('📦')[0].trim().replace(/·$/, '').trim();
  $('#상태').innerHTML =
    (알림 ? `<b>${홑(알림)}</b> · ` : '') +
    `${홑(결과.어떻게)} · ${결과.걸린}초` +
    (결과.특가수 ? ` · 특가 ${결과.특가수}건` : '') +
    (싼 ? ` · 최저 ${홑(싼.목적지)} ${돈(싼.가격)}원` : '');
  조건접기(false);
  지역칩만들기(); 달칩만들기(); 박칩만들기(); 정렬칩만들기();
  $('#도구줄').style.display = 'flex';
  $('#밑줄').style.display = 줄들.length ? 'flex' : 'none';
  담긴글갱신();
  그리기();
  지역한번펴기();          // 한 번 쫙 폈다가 1.5초 뒤 저 혼자 접힌다 (좁은 화면만)
}

/* ─────────────────────────────────────────── 결과 그리기 */
function 지역칩만들기() {
  const 센다 = {};
  줄들.forEach(r => { const g = r.지역 || '기타'; 센다[g] = (센다[g] || 0) + 1; });
  const 지역들 = Object.keys(센다);
  if (지역들.length < 2) { $('#지역줄').style.display = 'none'; return; }
  const 많은순 = 지역들.sort((a, b) => 센다[b] - 센다[a]).slice(0, 7);
  const 항목 = [['전체', '*', 줄들.length]].concat(많은순.map(g => [g, g, 센다[g]]));
  지역항목 = 항목;
  $('#지역줄').style.display = 'block';
  $('#지역칩').innerHTML = 항목.map(([글, 값, n]) =>
    `<button class="세로칩${값 === 지역값 ? ' 켬' : ''}" data-v="${홑(값)}">
      <span>${홑(글)}</span><i>${n}</i></button>`).join('');
  $('#지역칩').querySelectorAll('.세로칩').forEach(b => b.onclick = () => {
    지역값 = b.dataset.v; 보이는수 = 30; 펼친 = null; 지역칩만들기(); 그리기();
    // 골랐으면 볼 일이 끝났다 — 한 박자 보여주고 도로 접는다
    clearTimeout(지역타이머); 지역타이머 = setTimeout(() => 지역접기(false), 300);
  });
}

/* ── '찾은 곳'은 좁은 화면에서 화면의 절반을 먹는다.
      그래서 결과가 나오면 1.5초만 쫙 펴 보여주고 스르르 접는다. */
function 좁은가() { return window.innerWidth <= 900; }
function 지역요약글() {
  const 짝 = (지역항목 || []).find(([, 값]) => 값 === 지역값);
  return 짝 ? `${짝[0]} ${짝[2]}개` : '';
}
function 지역접기(펼침) { /* 결과 머리로 옮겨 늘 펴져 있다 */ }
function 지역한번펴기() { }
window.addEventListener('resize', () => {
  if (!좁은가()) { clearTimeout(지역타이머); 지역펼침 = true; 지역접기(true); }
});

function 달칩만들기() {
  const 달들 = [...new Set(줄들.map(r => String(r.가는날 || '').slice(0, 6)))].filter(Boolean).sort();
  if (달들.length < 2) { $('#달칩').innerHTML = ''; return; }
  const 항목 = [['월 상관없음', '*']].concat(달들.map(d => [`${parseInt(d.slice(4, 6))}월`, d]));
  $('#달칩').innerHTML = 항목.map(([글, 값]) =>
    `<button class="칩${값 === 달값 ? ' 켬' : ''}" data-v="${값}">${글}</button>`).join('');
  $('#달칩').querySelectorAll('.칩').forEach(b => b.onclick = () => {
    달값 = b.dataset.v; 보이는수 = 30; 펼친 = null; 달칩만들기(); 그리기();
  });
}

/* 며칠 다녀오나는 **찾기 전에 묻지 않고 결과에서 고른다** — 미리 묶으면 싼 걸 놓친다 */
function 박칩만들기() {
  const 박들 = [...new Set(줄들.map(r => r.박).filter(n => n !== null && n !== undefined))]
                .sort((a, b) => a - b);
  if (박들.length < 2) { $('#박칩').innerHTML = ''; 박값 = '*'; return; }
  if (박값 !== '*' && !박들.includes(+박값)) 박값 = '*';
  const 항목 = [['박수 상관없음', '*']].concat(박들.map(n => [`${n}박`, String(n)]));
  $('#박칩').innerHTML = 항목.map(([글, 값]) =>
    `<button class="칩${값 === 박값 ? ' 켬' : ''}" data-v="${값}">${글}</button>`).join('');
  $('#박칩').querySelectorAll('.칩').forEach(b => b.onclick = () => {
    박값 = b.dataset.v; 보이는수 = 30; 펼친 = null; 박칩만들기(); 그리기();
  });
}

function 정렬칩만들기() {
  const 항목 = [['최저가순', '값'], ['특가순', '특가'], ['절약순', '절약'], ['출발일순', '날짜']];
  $('#정렬칩').innerHTML = 항목.map(([글, 값]) =>
    `<button class="칩${값 === 정렬값 ? ' 켬' : ''}" data-v="${값}">${글}</button>`).join('');
  $('#정렬칩').querySelectorAll('.칩').forEach(b => b.onclick = () => {
    정렬값 = b.dataset.v; 보이는수 = 30; 펼친 = null; 정렬칩만들기(); 그리기();
  });
}

function 날짜보기(d) {
  if (!d) return '-';
  const s = String(d), y = +s.slice(0,4), m = +s.slice(4,6), dd = +s.slice(6,8);
  const 요일 = '일월화수목금토'[new Date(y, m-1, dd).getDay()];
  return `${m}/${dd}(${요일})`;
}
function 열쇠(r) { return [r.코드, r.가는날, r.오는날 || null]; }
function 담겼나(r) { return 담은.some(x => JSON.stringify(열쇠(x)) === JSON.stringify(열쇠(r))); }
function 가는법(r) {
  if (r.종류 === '편도조합') return '편도 2장 따로 사기';
  if (r.종류 === '오픈조') return `${(r.가는편||{}).도시||''} IN · ${(r.오는편||{}).도시||''} OUT`;
  return '';
}
function 보일값(r) { return r.확인값 || r.가격 || 0; }

function 그리기() {
  let 목 = 줄들.slice();
  if (지역값 !== '*') 목 = 목.filter(r => (r.지역 || '기타') === 지역값);
  if (달값 !== '*') 목 = 목.filter(r => String(r.가는날 || '').startsWith(달값));
  if (박값 !== '*') 목 = 목.filter(r => String(r.박) === 박값);
  // 줄세우기도 **실제로 살 수 있는 값**으로 한다 (확인이 끝난 줄은 그 값이 진짜다)
  if (정렬값 === '날짜') 목.sort((a, b) => (a.가는날 - b.가는날) || (보일값(a) - 보일값(b)));
  else if (정렬값 === '특가') 목.sort((a, b) => (b.점수 - a.점수) || (보일값(a) - 보일값(b)));
  else if (정렬값 === '절약') 목.sort((a, b) => ((b.절약||0) - (a.절약||0)) || (보일값(a) - 보일값(b)));
  else 목.sort((a, b) => 보일값(a) - 보일값(b));
  보임 = 목;

  const 앞말 = [지역값 === '*' ? '' : 지역값,
                달값 === '*' ? '' : `${parseInt(달값.slice(4,6))}월`].filter(Boolean).join(' · ');
  $('#결과글').textContent = 목.length
    ? (앞말 ? 앞말 + ' · ' : '') + `${목.length}개` : '결과 없음';

  if (!목.length) {
    빈화면('조건에 맞는 항공권이 없습니다 — 기간이나 예산을 넓혀 보세요');
    return;
  }
  const 싼값 = Math.min(...목.map(r => 보일값(r)));
  $('#목록').innerHTML = 목.slice(0, 보이는수).map((r, i) => 카드(r, i, 싼값)).join('')
    + (목.length > 보이는수
       ? `<div style="text-align:center;padding:8px"><button class="연버튼" id="더보기">
          ＋ ${목.length - 보이는수}개 더 보기</button></div>` : '');
  $('#목록').querySelectorAll('[data-펼침]').forEach(e =>
    e.onclick = () => { const i = +e.dataset.펼침; 펼친 = (펼친 === i) ? null : i; 그리기(); });
  $('#목록').querySelectorAll('[data-담기]').forEach(e =>
    e.onclick = ev => { ev.stopPropagation(); 담기(+e.dataset.담기); });
  $('#목록').querySelectorAll('[data-숙소]').forEach(e =>
    e.onclick = ev => { ev.stopPropagation(); 숙소찾기(+e.dataset.숙소); });
  const 더 = $('#더보기');
  if (더) 더.onclick = () => { 보이는수 += 30; 그리기(); };
}

function 카드(r, i, 싼값) {
  const 법 = 가는법(r);
  const 딱지 = (r.특가 ? `<span class="딱지 특가">특가 · 평균가 대비 ${r.할인}% 낮음</span>` : '')
    + (r.가격 === 싼값 ? `<span class="딱지 싼">최저가</span>` : '')
    + (법 ? `<span class="딱지 법">${홑(법)}</span>` : '');
  const 정보 = [
    날짜보기(r.가는날) + (r.오는날 ? ' → ' + 날짜보기(r.오는날) : '') +
      (r.박 !== null && r.박 !== undefined ? ` · ${r.박}박` : ''),
    r.경유 === 0 ? '직항' : (r.경유 ? `경유 ${r.경유}회` : ''),
    홑((r.항공사 || '').split(',')[0].trim()),
  ].filter(Boolean).join('  ·  ');
  const 평소 = (r.평소 && r.할인 > 0)
    ? `<div class="평소"><s>평균 ${돈(r.평소)}원</s><b>${r.할인}% 낮음</b></div>` : '';
  const 자리 = (r.백분위 !== null && r.백분위 !== undefined)
    ? `<div class="평소">최근 1년 기준 하위 ${Math.max(1, r.백분위)}% 가격</div>` : '';
  const 아낌 = r.절약 ? `<div class="평소">왕복 대비 <b>${돈(r.절약)}원</b> 절약</div>` : '';

  /* 이 값이 진짜인가 — 실제로 파는 곳에 물어본 결과.
     🛑 카드에는 **한 줄만** 둔다 (긴 설명은 [상세보기] 안으로 — 카드가 커지면 안 된다).
     안 물어본 줄은 '달력값'이라고 솔직히 말한다 (싼 것부터 열두 건만 물어본다). */
  const 등급 = {확인됨: '좋', 거의맞음: '좋', 차이남: '갸웃', 미끼의심: '나쁨', 못찾음: '갸웃'};
  let 확인줄 = `<div class="확인 아직">네이버 조회가 · 판매처 확인 전</div>`;
  if (r.교차) {
    const 상 = r.교차.상태;
    /* 🛑 '못찾음' 은 두 가지다 — **없어서** 못 찾은 것과, 값이 오긴 왔는데 **못 믿을
       값이라 뺀** 것. 둘을 같은 말로 적으면 화면이 또 거짓말을 한다 (8/11 2차). */
    const 뺀곳 = Object.keys((r.교차 && r.교차.막힘) || {});
    const 말 = (상 === '확인됨' || 상 === '거의맞음')
      ? `✓ 실제 판매가 확인${r.교차.싼곳 ? ` · ${홑(r.교차.싼곳)}` : ''}`
      : (상 === '못찾음'
           ? (뺀곳.length ? `? ${홑(뺀곳.join('·'))} 값은 신뢰할 수 없어 제외했습니다`
                          : '? 다른 판매처에는 이 날짜 편이 없습니다')
           : `⚠ 조회가 ${돈(r.가격)}원으로는 예약할 수 없습니다`);
    확인줄 = `<div class="확인 ${등급[상] || '갸웃'}">${말}</div>`;
  }

  /* 곳마다 값이 어떤 값인가. 네 가지가 있고, 넷이 다 달라 보여야 한다.
       ① 물어봐서 확인한 값      진한 글씨
       ② 네이버 달력값          흐린 글씨 + 점선 — **물어본 값이 아니다**
       ③ 못 믿을 값이라 뺀 곳    ⚠ + 붉은 테두리 (왜 뺐는지는 손 올리면 나온다)
       ④ 아예 안 물어본 곳       동그라미 하나
     🛑 8/11 요나고: ②를 ④처럼 그려 놓고 밑에 "값이 안 붙은 곳은 안 물어본 곳"이라
        적었다. 카드값이 바로 그 네이버에서 온 값인데 안 물어봤다고 적힌 것이다.
        화면이 아는 것을 숨기면, 화면이 거짓말을 한다. */
  const 교 = r.교차 || null;
  const 곳값 = (교 && 교.값들) || {};
  const 막힌곳 = (교 && 교.막힘) || {};
  const 값찾기 = k => 곳값[k] ?? (k.endsWith(' 직판') ? 곳값['직판'] : undefined);
  const 막힌왜 = k => 막힌곳[k] ?? (k.endsWith(' 직판') ? 막힌곳['직판'] : undefined);

  const 물어봤나 = !!Object.keys(곳값).length;
  const 달력값 = r.가격 || 0;                 // 카드가 처음 태어난 자리 = 네이버 달력

  const 파는곳 = (r.예약 || []).map(구 => {
    const 곳들 = Object.entries(구.곳 || {});
    if (!곳들.length) return '';
    const 여럿 = (r.예약 || []).length > 1;      // 편도 두 장이면 값은 구간별로 못 가른다

          const 값 = 여럿 ? undefined : 값찾기(k);
          const 왜 = 여럿 ? undefined : 막힌왜(k);
          // 🛑 [이 값] 은 **위에 뜬 값을 파는 곳**에만 붙인다.
          //    물어보고 나면 그 값은 네이버 게 아니라 제일 싼 곳 값이다 (8/9 오표기 사고).
          const 달력뿐 = !값 && !여럿 && k === '네이버' && 달력값 > 0;
          let 딱 = '', 덧 = '', 이름 = 홑(k);
          if (값) {
            딱 = `<b>${돈(값)}</b>`;
            이름 += ` — ${돈(값)}원 (물어봤습니다)`;
          } else if (왜) {
            딱 = `<b class="막힘딱">⚠</b>`; 덧 = ' 막힘';
            이름 += ` — 값을 뺐습니다: ${홑(왜)}`;
          } else if (달력뿐) {
            딱 = `<b class="달력값">${돈(달력값)}</b>`; 덧 = ' 달력';
            이름 += 물어봤나 ? ` — 네이버 달력값 ${돈(달력값)}원 (실제로 파는지는 안 물어봤습니다)`
                             : ` — 이 값 (네이버 달력값)`;
          } else {
            이름 += ' — 안 물어봤습니다';
          }
          return `<a href="${홑(v)}" target="_blank" rel="noopener" title="${이름}"
                     class="${딱 ? '' : '민'}${덧}${값 && 값 === 교.싼값 ? ' 싼곳' : ''}"
                     style="--점:${색}"><i>${홑(글)}</i>${딱}</a>`;
        }).join('') + `</div>`;
  }).join('');
  const 막힌수 = Object.keys(막힌곳).length;
  const 파는곳말 = 교 && (물어봤나 || 막힌수)
    ? `<em>어디서 사나요</em> · ${홑(교.한줄 || '')}<br>

       ${막힌수 ? '<em>⚠</em> 는 못 믿을 값이라 뺀 곳이며, ' : ''}값이 없는 동그라미는 안 물어본 곳입니다.`
    : `<em>어디서 사나요</em> · 위의 값은 <em>네이버 달력값</em>입니다 —
       같은 비행기라도 파는 곳마다 값이 다릅니다. 두세 군데 눌러 보세요.`;
  const 예약 = 파는곳 ? `<div class="살곳">
      <div class="살곳머리">${파는곳말}</div>${파는곳}</div>` : '';

  const 펼침 = (펼친 === i);

    <div class="카드머리">

             이 DOM 순서 그대로(별·값·값밑·잔줄) 흘러간다. 넓은 화면만 order 로 눕힌다. -->
        <div class="값칸">

                  title="담으면 콘텐츠에 들어갑니다">${담겼나(r) ? '★' : '☆'}</button>
          <span class="값">${돈(보일값(r))}원</span>

           🛑 [상세보기]가 접혀도 이 단추는 남는다 (펼친 카드에서도 누를 수 있어야 한다) -->

}

function 담기(i) {

/* ══════════════════════════════════════════════════════════ 🏨 숙박
   항공권 쪽과 **같은 뼈대**로 돈다 — 조건 모으기 → /api/stay/search →
   /api/job/{id} 지켜보기 → 결과 그리기. 지켜보는 길이 같아서 코드가 거의 겹친다.
   다른 건 하나뿐: 숙박은 값 하나로 줄 세우지 않는다. **가성비가 기본 정렬**이다. */
let 숙메타 = null, 숙언제값 = '한달', 숙박값 = 1, 숙고른곳 = new Set();
let 숙객 = {성인: 2, 아이나이: []}, 숙시작 = '', 숙끝 = '';
let 숙줄들 = [], 숙보임 = [], 숙작업 = null, 숙도는중 = false;
let 숙정렬값 = '추천', 숙종류값 = '*', 숙보이는수 = 30, 숙넘어옴 = null;
let 숙로그폄 = false;
/* 빼고 볼 종류. 왼쪽 칩과 목록 칩의 [✕] 가 **같은 이 하나**를 만진다 —
   두 벌로 두면 한쪽에서 뺀 게 다른 쪽에 안 보여서 손님이 두 번 누르게 된다. */
let 숙제외 = new Set();

const 숙후기항목 = [['상관없음', 0], ['7.0 이상', 7], ['8.0 이상', 8], ['8.5 이상', 8.5]];

/* 🛑 탭을 누르는 것과 항공 카드의 [🏨 숙소] 가 **동시에** 이걸 부를 수 있다.
   약속(Promise)을 하나만 두고 둘 다 그걸 기다리게 한다 — 안 그러면 메타를 두 번 받고
   칩이 두 번 그려지면서 방금 고른 조건이 초기값으로 되돌아간다. */
let 숙깨는중 = null;
function 숙박깨우기() {

async function _숙박깨우기() {

let 숙최소후기 = 0;

/* ── 빼고 보기 · 어디서 찾을까 (왼쪽 칸) */
function 숙제외칩그리기() {
  const 목 = (숙메타?.잘빼는종류 || []).concat(

/* 🛑 빼기는 **화면에서만** 걸러도 된다 — 이미 받아 온 목록에서 지우는 것이라

function 숙목적지글() {

function 숙정한날() {

  const 박 = 날수(숙시작, 숙끝);
  return (박 >= 1 && 박 <= 30) ? [숙시작, 숙끝, 박] : null;
}
function 숙박수() { const 정 = 숙정한날(); return 정 ? 정[2] : 숙박값; }
function 숙사람글() {

  const 정 = 숙정한날();

/* ── 항공 카드의 [🏨 숙소] 에서 넘어오는 문 */
async function 숙소찾기(i) {
  const r = 보임[i];
  if (!r) return;
  탭보이기('숙박');
  await 숙박깨우기();                 // 메타가 와야 칩·도시 목록을 그릴 수 있다
  숙넘어옴 = {목적지: r.목적지, 코드: r.코드,
             가는날: r.가는날, 오는날: r.오는날 || null,
             값: 보일값(r)};
  // 왼쪽 조건도 이 여행에 맞춰 둔다 — 손님이 [다시 찾기]를 눌러도 같은 여행이 나오게

async function 숙박찾기() {

  const 몸 = 숙조건모으기();
  if (숙넘어옴) 몸.항공 = {목적지: 숙넘어옴.목적지, 코드: 숙넘어옴.코드,
                          가는날: 숙넘어옴.가는날, 오는날: 숙넘어옴.오는날};
  let 답;
  try {
    답 = await (await fetch(밑 + 'api/stay/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(몸)
    })).json();
  } catch (e) { 숙실패('서버에 연결이 안 됩니다.'); return; }

  if (답.잘못) { 숙실패(답.잘못); return; }
  if (답.바로) { 숙결과받음(답.결과, 답.말); return; }
  숙작업 = 답.작업;
  if (답.앞에 > 0) $('#숙찾는말').textContent = `앞에 ${답.앞에}명이 찾고 있어요 — 곧 시작해요`;
  숙기다리기();
}

function 숙기다리기() {
  const 작업 = 숙작업;
  const 돌기 = async () => {
    if (숙작업 !== 작업) return;
    let 일;
    try { 일 = await (await fetch(밑 + 'api/job/' + 작업)).json(); }
    catch (e) { setTimeout(돌기, 1500); return; }
    if (일.잘못) { 숙실패(일.잘못); return; }
    숙안내갱신(일);
    if (일.상태 === '끝') { 숙결과받음(일.결과); return; }
    if (일.상태 === '실패') { 숙실패(일.말); return; }
    setTimeout(돌기, 900);
  };
  돌기();
}

function 숙안내갱신(일) {
  const 로그 = 일.로그 || [];
  let 말 = '숙소를 확인하고 있습니다';
  for (const l of 로그) {
    if (l.includes('차례를 기다')) 말 = '앞선 검색이 끝나는 대로 시작합니다';
    if (l.includes('아시아')) 말 = '도시별로 저렴한 날짜를 확인하고 있습니다';
    if (l.includes('갈라서')) 말 = '선택하신 도시를 날짜별로 확인하고 있습니다';
    if (l.includes('받았습니다')) 말 = '가격 대비 만족도를 매기고 있습니다';
    if (l.startsWith('[✈→🏨]')) 말 = '항공권 날짜에 맞춰 숙소를 찾고 있습니다';
  }
  $('#숙찾는말').textContent = 말;
  const [끝, 총] = 일.진행 || [0, 0];
  const m = $('#숙막대');
  if (총 && 끝 < 총) {
    m.classList.remove('흐름'); $('#숙막대속').style.width = Math.round(끝 / 총 * 100) + '%';
    $('#숙진행글').textContent = `${끝} / ${총}곳`;
  } else {
    m.classList.add('흐름'); $('#숙막대속').style.width = ''; $('#숙진행글').textContent = '';
  }
  $('#숙로그칸').textContent = 로그.join('\n');
  $('#숙로그칸').scrollTop = $('#숙로그칸').scrollHeight;
}

function 숙로그토글() {
  숙로그폄 = !숙로그폄;
  $('#숙로그칸').style.display = 숙로그폄 ? 'block' : 'none';
  $('#숙자세히단추').textContent = 숙로그폄 ? '접기' : '진행 자세히';
}
function 숙비행보이기(켬) {
  const e = $('#숙비행');
  if (켬) {
    e.classList.remove('사라짐'); e.style.display = 'block';
    $('#숙찾는말').textContent = '숙소를 확인하고 있습니다';
    $('#숙찾는곁말').textContent = ''; $('#숙진행글').textContent = '';
    $('#숙로그칸').textContent = '';
    $('#숙막대').classList.add('흐름'); $('#숙막대속').style.width = '';
  } else {
    e.classList.add('사라짐');
    setTimeout(() => { if (!숙도는중) e.style.display = 'none'; }, 480);
  }
}
function 숙바쁨(켬) {
  숙도는중 = 켬;
  $('#숙찾기버튼').disabled = 켬;
  $('#숙찾기버튼').textContent = 켬 ? '검색 중…' : '검색';
}
function 숙실패(말) {
  숙바쁨(false); 숙작업 = null;
  $('#숙비행').style.display = 'none';
  $('#숙상태').textContent = '✗ ' + 말;
}

function 숙넘어옴그리기() {
  const e = $('#숙넘어옴');
  if (!숙넘어옴) { e.innerHTML = ''; return; }
  const ㄴ = 숙넘어옴;
  e.innerHTML = `<div class="넘어옴">
    <span>✈ <b>${홑(ㄴ.목적지)}</b> 항공권 ${돈(ㄴ.값)}원에 맞춘 숙소입니다 —
      ${날짜보기(ㄴ.가는날)}${ㄴ.오는날 ? ' → ' + 날짜보기(ㄴ.오는날) : ' 부터 2박'}</span>
    <button class="연버튼 되돌기" onclick="숙넘어옴끄기()">✕ 조건 해제</button>
  </div>`;
}
function 숙넘어옴끄기() {
  숙넘어옴 = null; 숙넘어옴그리기(); 숙요약갱신();
}

function 숙결과받음(결과, 앞말) {
  숙바쁨(false); 숙작업 = null;
  숙비행보이기(false);
  숙줄들 = 결과.줄 || [];
  const 싼 = 결과.제일싼;
  const ㅎ = 결과.흐름요약 || null;
  let 날말 = '';
  if (ㅎ && ㅎ.이날) {
    const 할 = ㅎ.이날.할인 || 0;
    날말 = ` · 이 날짜는 이 도시 평균보다 ${할 > 0 ? `${할}% 낮음` : `${Math.abs(할)}% 높음`}`
         + ` (향후 ${ㅎ.본날수}일 중 하위 ${ㅎ.이날.자리}% 가격)`;
  }
  const 소 = 결과.소스별 || {};
  const 소글 = Object.keys(소).filter(k => k !== '값을 견준 곳' && 소[k])
                 .map(k => `${k} ${소[k]}`).join(' · ');
  const 숙알림 = String(앞말 || '').split('📦')[0].trim().replace(/·$/, '').trim();
  $('#숙상태').innerHTML =
    (숙알림 ? `<b>${홑(숙알림)}</b> · ` : '') +
    `${홑(결과.어떻게)} · ${결과.걸린}초` +
    (결과.특가수 ? ` · 특가 ${결과.특가수}건` : '') +
    (싼 ? ` · 최저 1박 ${돈(싼['1박'])}원 (${홑(싼.목적지)})` : '') + 날말 +
    (소글 ? `<div style="font-size:12px;color:var(--연보조);margin-top:4px">
       찾아본 곳 — ${홑(소글)}${소['값을 견준 곳'] ? ` · 같은 숙소 값을 견준 곳 ${소['값을 견준 곳']}건` : ''}</div>` : '');
  숙지역칩만들기(); 숙종류칩만들기(); 숙정렬칩만들기();
  $('#숙도구줄').style.display = 'flex';
  숙그리기();
}

/* ── 도구줄 */
/* 🛑 [Trip Fit 추천] 은 **절대 못 누르게 만들면 안 된다.** 예전엔 추천이 0건이면
   disabled 를 걸었는데, 손님 눈에는 '있는데 안 눌리는 버튼' 이고 왜 안 되는지 알 길이 없다.
   추천은 **줄 세우는 자**다 — 추천할 만한 게 없으면 목록이 비는 게 아니라
   순위 밖 숙소들이 아래로 내려갈 뿐이다. 그러니 늘 눌린다. */
function 숙정렬칩만들기() {
  const 추 = 숙줄들.filter(r => (r.추천등급 || 0) > 0).length;
  const 항목 = [['TripFit 추천' + (추 ? ` ${추}` : ''), '추천'],
                ['가성비순', '가성비'], ['최저가순', '값'], ['특가순', '특가'],
                ['후기순', '후기'], ['역세권순', '위치']];
  $('#숙정렬칩').innerHTML = 항목.map(([g, v]) =>
    `<button class="칩${v === 숙정렬값 ? ' 켬' : ''}${v === '추천' ? ' 추천칩' : ''}"
             data-v="${v}">${홑(g)}</button>`).join('');
  $('#숙정렬칩').querySelectorAll('.칩').forEach(b => b.onclick = () => {
    숙정렬값 = b.dataset.v; 숙보이는수 = 30; 숙정렬칩만들기(); 숙그리기();
  });
}
/* 종류 칩 — 몸통을 누르면 '그것만', [✕] 를 누르면 '그건 빼고'.
   같은 칩에 두 손잡이를 단 이유: 손님이 보는 목록에 세어 놓은 숫자가 여기 있어서,
   왼쪽 칸까지 눈을 옮기지 않고 그 자리에서 뺄 수 있어야 한다. */
function 숙종류칩만들기() {
  const 센다 = {};
  숙줄들.forEach(r => { const t = r.종류 || '기타'; 센다[t] = (센다[t] || 0) + 1; });
  const 많은순 = Object.keys(센다).sort((a, b) => 센다[b] - 센다[a]).slice(0, 8);
  if (많은순.length < 2) { $('#숙종류칩').innerHTML = ''; 숙뺀줄그리기(); return; }
  $('#숙종류칩').innerHTML =
    `<button class="칩${숙종류값 === '*' ? ' 켬' : ''}" data-v="*">전체</button>`
    + 많은순.map(t =>
      `<button class="칩${t === 숙종류값 ? ' 켬' : ''}${숙제외.has(t) ? ' 뺀' : ''}"
               data-v="${홑(t)}">${홑(t)} ${센다[t]}<span class="엑스" data-뺄="${홑(t)}"
               title="${숙제외.has(t) ? '도로 넣기' : '이 종류는 빼고 보기'}"
               >${숙제외.has(t) ? '↺' : '✕'}</span></button>`).join('');
  $('#숙종류칩').querySelectorAll('.칩').forEach(b => b.onclick = e => {
    const 뺄 = e.target.dataset && e.target.dataset.뺄;
    if (뺄) { e.stopPropagation(); 숙제외.has(뺄) ? 숙되돌리기(뺄) : 숙빼기(뺄); return; }
    숙종류값 = b.dataset.v; 숙보이는수 = 30; 숙종류칩만들기(); 숙그리기();
  });
  숙뺀줄그리기();
}
function 숙뺀줄그리기() {
  const e = $('#숙뺀줄');
  if (!숙제외.size) { e.style.display = 'none'; e.innerHTML = ''; return; }
  e.style.display = 'flex';
  e.innerHTML = `<b>✕ 빼고 보는 중</b>`
    + [...숙제외].map(t =>
        `<button class="연버튼" style="padding:3px 9px;font-size:12px"
                 data-되돌="${홑(t)}">${홑(t)} ↺</button>`).join('')
    + `<button class="연버튼" style="padding:3px 9px;font-size:12px"
               data-비움="1">전부 도로 넣기</button>`;
  e.querySelectorAll('[data-되돌]').forEach(b =>
    b.onclick = () => 숙되돌리기(b.dataset.되돌));
  e.querySelector('[data-비움]').onclick = 숙제외비우기;
}
function 숙지역칩만들기() {
  const 센다 = {};
  숙줄들.forEach(r => { const g = r.목적지 || '기타'; 센다[g] = (센다[g] || 0) + 1; });
  const 곳들 = Object.keys(센다);
  if (곳들.length < 2) { $('#숙지역줄').style.display = 'none'; return; }
  const 많은순 = 곳들.sort((a, b) => 센다[b] - 센다[a]).slice(0, 12);
  const 항목 = [['전체', '*', 숙줄들.length]].concat(많은순.map(g => [g, g, 센다[g]]));
  $('#숙지역줄').style.display = 'block';
  $('#숙지역칩').innerHTML = 항목.map(([글, 값, n]) =>
    `<button class="세로칩${값 === 숙곳값 ? ' 켬' : ''}" data-v="${홑(값)}">
      <span>${홑(글)}</span><i>${n}</i></button>`).join('');
  $('#숙지역칩').querySelectorAll('.세로칩').forEach(b => b.onclick = () => {
    숙곳값 = b.dataset.v; 숙보이는수 = 30; 숙지역칩만들기(); 숙그리기();
  });
}
let 숙곳값 = '*';

/* ── 목록 */
const 숙추천머리 = {
  1: ['4성급 이상 · 가격이 낮은 곳', '흔치 않은 조합입니다'],
  2: ['가격이 낮은 곳', '1인 침대 요금·후기 없는 곳은 제외했습니다'],
  3: ['시설과 후기가 모두 좋은 곳', '후기가 충분히 쌓인 곳만'],
  4: ['역·번화가에서 가까운 곳', ''],
  9: ['그 밖의 곳', '가성비 순'],
};

/* 🛑 추천 문구는 **엔진(숙박검색.py)이 미리 적어 둔 말**이라 화면에서 못 고친다.
   엔진을 고쳐도 이미 만들어 둔 묶음에는 옛 말이 그대로 남는다 → 화면에 내보내기 직전에
   말투만 다듬는다. 뜻은 건드리지 않는다(숫자·대상은 그대로). */
const 말다듬기 = t => String(t == null ? '' : t)
  .replace(/(\d+)% 싸다/g, '$1% 낮음')
  .replace(/(\d+)원 싸다/g, '$1원 낮음')
  .replace(/인데 싸다/g, '인데 가격이 낮다')
  .replace(/값이 눈에 띄게 싸다/g, '가격이 눈에 띄게 낮다')
  .replace(/싼데 평이 좋다/g, '가격 대비 평가가 좋다')
  .replace(/싼 쪽 (\d+)%/g, '하위 $1% 가격')
  .replace(/보통값/g, '평균가')
  .replace(/평 (\d)/g, '평점 $1');

function 숙그리기() {
  let 목 = 숙줄들.slice();
  if (숙곳값 !== '*') 목 = 목.filter(r => r.목적지 === 숙곳값);
  if (숙종류값 !== '*') 목 = 목.filter(r => (r.종류 || '기타') === 숙종류값);
  if (숙제외.size) 목 = 목.filter(r => !숙제외.has(r.종류 || '기타'));
  const 뺀수 = (숙곳값 === '*' && 숙종류값 === '*') ? 숙줄들.length - 목.length : 0;

  if (숙정렬값 === '추천') {
    // 🛑 추천은 **점수 하나로 줄 세우는 게 아니다.** 등급이 먼저고 점수는 그 안에서만
    //    본다. 4순위 100점이 1순위 30점보다 위에 서면 순위라는 말이 뜻을 잃는다.
    // 🛑 그리고 **아무것도 감추지 않는다.** 순위에 못 든 곳은 사라지는 게 아니라
    //    맨 아래 [그 밖의 곳] 으로 내려간다 — 숨기면 손님은 목록이 고장난 줄 안다.
    목 = 목.map(r => Object.assign(r, {_급: (r.추천등급 || 0) > 0 ? r.추천등급 : 9}))
           .sort((a, b) => a._급 - b._급
                        || (b.추천점수 || 0) - (a.추천점수 || 0)
                        || b.가성비 - a.가성비);
  } else {
    const 자 = {가성비: r => -r.가성비, 값: r => r['1박'], 특가: r => -(r.딜점수 || 0),
                후기: r => -(r.후기 || 0), 위치: r => (r.가까운곳?.미터 ?? 99999)}[숙정렬값];
    목.sort((a, b) => 자(a) - 자(b) || a['1박'] - b['1박']);
  }
  숙보임 = 목;

  const 추천수 = 목.filter(r => (r.추천등급 || 0) > 0).length;
  $('#숙결과글').textContent =
    (목.length
      ? (숙정렬값 === '추천'
          ? `${목.length}곳 · 추천 ${추천수}곳`
          : `${목.length}곳`)
      : '결과 없음')
    + (뺀수 ? ` · ${뺀수}곳 제외` : '');
  if (!목.length) {
    숙빈화면('조건에 맞는 숙소가 없습니다 — 예산이나 후기 조건을 넓혀 보세요');
    return;
  }

  let 글 = '', 앞등급 = 0;
  // 순위가 하나도 안 붙은 목록(옛 결과가 남아 있는 경우)이면 머리글을 달지 않는다 —
  // 안 그러면 [그 밖의 곳] 한 줄만 덩그러니 뜬다
  const 머리달까 = 숙정렬값 === '추천' && 추천수 > 0;
  if (숙정렬값 === '추천' && !추천수) {
    글 += `<div class="추천머리" style="color:var(--연보조)">
      순위를 매길 자료가 없는 목록입니다 — 다시 검색해 주세요<i></i></div>`;
  }
  목.slice(0, 숙보이는수).forEach(r => {
    if (머리달까 && r._급 !== 앞등급) {
      앞등급 = r._급;
      const [제, 곁] = 숙추천머리[앞등급] || ['', ''];
      글 += `<div class="추천머리">${앞등급 === 9 ? '' : 앞등급 + '순위 · '}${홑(제)}
               ${곁 ? `<span>${홑(곁)}</span>` : ''}<i></i></div>`;
    }
    글 += 숙카드(r);
  });
  $('#숙목록').innerHTML = 글
    + (목.length > 숙보이는수
       ? `<div style="text-align:center;padding:8px"><button class="연버튼" id="숙더보기">
          ＋ ${목.length - 숙보이는수}개 더 보기</button></div>` : '');
  const 더 = $('#숙더보기');
  if (더) 더.onclick = () => { 숙보이는수 += 30; 숙그리기(); };
}

function 숙빈화면(말) {
  $('#숙목록').innerHTML = `<div class="빈"><div class="큰">🏨</div>
    <div style="margin-top:14px">${홑(말 || '조건을 고르고 검색해 주세요')}</div></div>`;
}

function 숙카드(r) {
  const 후 = r.후기 || 0, 후수 = r.후기수 || 0;
  const 후기알 = 후수 > 0
    ? `<span class="후기알${후 < 7.5 ? ' 낮' : ''}">${후.toFixed(1)}</span>
       <span class="조각" style="font-size:12px;color:var(--연보조)">후기 ${돈(후수)}개</span>`
    : `<span class="후기알 없">후기 없음</span>`;
  const 별 = r.별 >= 1 ? `<span class="조각" style="color:var(--금)">★ ${r.별}성급</span>` : '';
  const 역 = r.가까운곳 && r.가까운곳.미터
    ? `<span class="조각">🚉 ${홑(r.가까운곳.이름)} ${돈(r.가까운곳.미터)}m</span>` : '';
  const 딱지 = [
    r.특가 ? `<span class="딱지 특가">특가${r.특가이유 ? ' · ' + 홑(말다듬기(r.특가이유)) : ''}</span>` : '',
    r.숙소할인 >= 10 ? `<span class="딱지 좋">정가 대비 ${r.숙소할인}% 낮음</span>` : '',
    r.무료취소 ? `<span class="딱지 좋">무료 취소</span>` : '',
    r.침대값섞임 ? `<span class="딱지 흐림">1인 침대 요금일 수 있습니다</span>` : '',
    r.같은곳 ? `<span class="딱지 흐림">같은 값 방 ${r.같은곳}개</span>` : '',
    r.날모름 ? `<span class="딱지 흐림">날짜 비교 없음</span>` : '',
  ].filter(Boolean).join('');
  const 예약 = Object.entries(r.예약 || {});
  const 사진 = r.사진
    ? `<img class="숙사진" src="${홑(r.사진)}" alt="" loading="lazy"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'숙사진 빔',textContent:'🏨'}))">`
    : `<div class="숙사진 빔">🏨</div>`;

  const 급 = r.추천등급 || 0;
  const 추천 = 급
    ? `<span class="추천딱 급${급}">${급}순위 · ${홑(말다듬기(r.추천이름))}</span>` : '';
  const 추천말 = (급 && r.추천말)
    ? `<div class="추천말">${급 === 1 ? '<b>' : ''}${홑(말다듬기(r.추천말))}${급 === 1 ? '</b>' : ''}</div>` : '';
  // 두 집 값을 견줘 봤을 때. 🛑 차이가 크면 같은 방이 아닐 수 있어 단정하지 않는다.
  const 딴 = r.딴곳값 || {};
  const 견줌 = Object.keys(딴).length > 1
    ? `<div class="견줌">` + Object.entries(딴)
        .sort((a, b) => a[1] - b[1])
        .map(([k, v], i) => i === 0
          ? `${홑(k)} <b>${돈(v)}원</b>`
          : ` · ${홑(k)} <s>${돈(v)}원</s>`).join('')
      + (r.값차이믿음 && r.아낀값 > 0
         ? ` — <b>${돈(r.아낀값)}원 낮음</b>`
         : ` <span style="color:var(--연보조)">(객실 조건이 다를 수 있습니다)</span>`)
      + `</div>`
    : '';

  return `<div class="카드${급 === 1 ? ' 으뜸' : ''}"><div class="숙카드">
    ${사진}
    <div class="숙속">
      ${추천 ? `<div class="숙딱지줄" style="margin:0 0 5px">${추천}</div>` : ''}
      <a class="숙이름" href="${홑((예약[0] || [])[1] || '#')}" target="_blank" rel="noopener"
         >${홑(r.이름)}</a>
      <div class="숙줄">
        <span class="조각" style="color:var(--브랜드);font-weight:700">${홑(r.목적지)}</span>
        ${r.동네 ? `<span class="조각">${홑(r.동네)}</span>` : ''}
        ${r.종류 ? `<span class="조각">${홑(r.종류)}</span>` : ''}${별}
        ${r.곳 ? `<span class="곳딱">${홑(r.곳)}</span>` : ''}
      </div>
      <div class="숙줄">${후기알}${역}</div>
      ${추천말}
      <div class="가성비줄">
        <div class="가성비막대"><i style="width:${Math.max(3, Math.min(100, r.가성비))}%"></i></div>
        <span class="가성비글">가성비 <b>${r.가성비}</b> ·
          이 도시 하위 ${r.값자리}% 가격</span>
      </div>
      ${견줌}
      <div class="숙딱지줄">${딱지}</div>
    </div>
    <div class="숙값칸">
      <div class="숙값">${돈(r['1박'])}원</div>
      <div class="숙값밑">1박 · 세금·수수료 포함<br>
        ${typeof r.총액 === 'number'
            ? `${홑(r.셈단위 || (r.박 + '박'))} 합계 <b>${돈(r.총액)}원</b>`
            : `${r.박}박 합계는 확인되지 않았습니다`}</div>
      <div class="숙단추줄">
        ${예약.map(([k, v]) =>
          `<a class="연버튼 살버튼" href="${홑(v)}" target="_blank" rel="noopener"
              style="text-decoration:none">${홑(k)} ↗</a>`).join('')}
      </div>
    </div>
  </div></div>`;
}

/* ─────────────────────────────────────────── 콘텐츠 */
async function 콘텐츠(종류) {
  if (!줄들.length || !끝난작업) { alert('먼저 항공권을 찾아주세요.'); return; }
  $('#글제목').textContent = {문구: '📋 문구 (인스타·스레드·카톡에 그대로)',
    블로그: '📝 블로그 글 (.md)', 인스타: '📷 인스타 카드 (1080×1350)'}[종류];
  $('#글속').innerHTML = '<div style="padding:30px;text-align:center;color:var(--연보조)">만드는 중…</div>';
  $('#내려받기').style.display = 'none';
  $('#복사버튼').style.display = (종류 === '인스타') ? 'none' : '';
  열기('글덮개');

  const 담긴 = (담은.length ? 담은 : 보임.slice(0, 40)).map(열쇠);
  let 답;
  try {
    답 = await (await fetch(밑 + 'api/content', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({작업: 끝난작업, 종류: 종류, 담은: 담긴})
    })).json();
  } catch (e) { $('#글속').textContent = '만들지 못했습니다.'; return; }

  if (답.잘못) { $('#글속').innerHTML = `<div style="color:var(--빨강)">${홑(답.잘못)}</div>`; return; }
  마지막글 = 답.글 || '';
  if (종류 === '인스타') {
    $('#글속').innerHTML = `<img src="${밑}file/${홑(답.파일)}"
      style="max-width:100%;border:1px solid var(--테두리);border-radius:10px">`;
  } else {
    $('#글속').innerHTML = `<textarea readonly style="width:100%;height:52vh;border:1px solid var(--진테두리);
      border-radius:10px;padding:12px;font-size:14px;line-height:1.6;font-family:inherit">${홑(답.글 || '')}</textarea>`;
  }
  if (답.파일) { $('#내려받기').href = 밑 + 'file/' + 답.파일; $('#내려받기').style.display = ''; }
}
function 글복사() {
  navigator.clipboard.writeText(마지막글).then(
    () => { $('#복사버튼').textContent = '✔ 복사했습니다';
            setTimeout(() => $('#복사버튼').textContent = '📋 복사', 1600); },
    () => alert('복사가 안 됩니다 — 글을 직접 긁어서 복사해주세요.'));
}
