/* 코드 편집기는 딴 쪽(/edit)에 있다 — 이 화면과 섞으면 손님이 헷갈린다 */
function 편집창() { window.open(밑 + 'edit', '_blank'); }


/* ══════════════════════════════════════════════════════════ ⭐ BEST
   같은 조건으로 항공권 한 번 · 숙소 한 번을 찾아 **도시를 열쇠로** 짝짓는다.
   싼 순서로 열 곳만 남긴다 — 고르는 수고 없이 "이 값이면 어디를 갈 수 있나"가 한 장에 보인다.

   🛑 날짜까지 맞춘 값이 아니다. 항공은 그 기간에서 제일 싼 날, 숙소는 같은 도시의
      N박 최저가다. 두 날짜는 다를 수 있다 → 카드 아래에 **예상 합계라고 적는다.**
      (미리 만들어 둔 값을 맞는 척 흘리면 그때부터 화면이 거짓말을 한다)
   🛑 숙소는 값만 보고 고르지 않는다. 도미토리·1인 침대 값이 섞인 줄을 빼고,
      후기 8.0 이상(30건 이상)을 **먼저** 본 다음에야 값을 견준다.        */
let 베언제값 = '여섯달', 베박값 = 2, 베시작 = '', 베끝 = '';
let 베객 = {성인: 2, 아이나이: []};
let 베도는중 = false, 베줄들 = [], 베깼나 = false;
const 베뺄종류 = ['호스텔', '캡슐 호텔', '게스트하우스', '민숙'];

function 베스트깨우기() {
  숙박깨우기();                       // 숙소 쪽 메타(도시·검색처)도 있어야 한다
  if (베깼나) return;
  베깼나 = true;
  베필드갱신();
  if (!베줄들.length) 베빈화면('출발지와 기간을 고르고 [BEST 10 보기] 를 눌러 주세요');
}
function 베정한날() {
  if (베언제값 !== '직접' || !베시작 || !베끝) return null;
  const 박 = 날수(베시작, 베끝);
  return (박 >= 1 && 박 <= 30) ? [베시작, 베끝, 박] : null;
}
function 베박수() { const 정 = 베정한날(); return 정 ? 정[2] : 베박값; }
/* 🛑 항공 묶음의 박 버킷과 1:1 이어야 한다 (0·1·2·3·4-6·6-8) */
function 베며칠값() {
  const n = 베박수();
  return n <= 3 ? [n, n] : (n <= 6 ? [4, 6] : [6, 8]);
}
function 베필드갱신() {
  const 정 = 베정한날();
  $('#베언제칸글').textContent = 정 ? 긴날(정[0]) : 기간글(베언제값);
  $('#베며칠칸글').textContent = 정 ? 긴날(정[1]) : `${베박값}박`;
  $('#베사람칸글').textContent = `성인 ${베객.성인}명`
    + (베객.아이나이.length ? ` · 아이 ${베객.아이나이.length}명` : '');
}

/* 서버가 바로 답할 때(미리 찾아 둔 값)와 오래 걸릴 때(집 PC 가 직접 훑는다)를
   **한 함수 안에서** 같게 만든다 — BEST 는 두 번 부르므로 갈래가 둘이면 코드가 네 겹이 된다. */
async function 한번검색(길, 몸) {
  const 답 = await (await fetch(밑 + 길, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(몸)
  })).json();
  if (답.잘못) throw new Error(답.잘못);
  if (답.바로) return {결과: 답.결과, 말: 답.말 || ''};
  for (let i = 0; i < 400; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const 일 = await (await fetch(밑 + 'api/job/' + 답.작업)).json();
    if (일.잘못) throw new Error(일.잘못);
    if (일.상태 === '끝') return {결과: 일.결과, 말: 일.말 || ''};
    if (일.상태 === '실패') throw new Error(일.말 || '자료를 받지 못했습니다');
  }
  throw new Error('시간이 너무 오래 걸립니다');
}

async function 베스트찾기() {
  if (베도는중) return;
  베바쁨(true);
  $('#베목록').innerHTML = '';
  $('#베상태').textContent = '';
  const 박 = 베박수();
  const 항몸 = {
    출발지이름: $('#베출발지').value,
    성인: 1, 좌석: '일반석', 소아: 0, 유아: 0, 아이나이: [],
    예산만원: 0, 직항만: false, 주말만: false,
    편도: false, 편도조합: false, 오픈조: false,
    언제: 베언제값, 직접기간: [베시작, 베끝], 며칠: 베며칠값(), 고른곳: [],
  };
  const 숙몸 = {
    성인: Math.max(1, 베객.성인), 아이나이: [...베객.아이나이],
    언제: 베언제값, 직접기간: [베시작, 베끝], 박수: 박,
    예산만원: 0, 최소후기: 0, 침대값빼기: true,
    숙소종류: [], 제외종류: [...베뺄종류], 주말만: false, 소스: {}, 고른곳: [],
  };
  try {
    const [항, 숙] = await Promise.all([
      한번검색('api/search', 항몸),
      한번검색('api/stay/search', 숙몸),
    ]);
    베짝짓기(항.결과.줄 || [], 숙.결과.줄 || [], 박, [항.말, 숙.말]);
  } catch (e) {
    $('#베상태').textContent = '✗ ' + e.message;
    베빈화면('조건을 바꿔 다시 시도해 주세요');
  } finally {
    베바쁨(false);
  }
}

function 베숙총액(r, 박) {
  if (typeof r.총액 === 'number' && r.박 === 박) return r.총액;
  const 하루 = r['1박'] || (r.총액 && r.박 ? Math.round(r.총액 / r.박) : 0);
  return 하루 ? 하루 * 박 : 0;
}
const 베좋은숙소 = r => (r.후기 || 0) >= 8 && (r.후기수 || 0) >= 30;

function 베짝짓기(항줄, 숙줄, 박, 말들) {
  const 인원 = Math.max(1, 베객.성인);

  const 항최저 = {};
  항줄.forEach(r => {
    const 값 = r.확인값 || r.가격 || 0;
    if (!값 || !r.목적지) return;
    const 옛 = 항최저[r.목적지];
    if (!옛 || 값 < (옛.확인값 || 옛.가격)) 항최저[r.목적지] = r;
  });

  const 숙최저 = {};
  숙줄.forEach(r => {
    if (!r.목적지 || r.침대값섞임 || 베뺄종류.includes(r.종류)) return;
    if (!베숙총액(r, 박)) return;
    const 옛 = 숙최저[r.목적지];
    if (!옛) { 숙최저[r.목적지] = r; return; }
    // 후기 좋은 곳이 먼저다. 같은 급끼리만 값으로 견준다.
    if (베좋은숙소(r) !== 베좋은숙소(옛)) { if (베좋은숙소(r)) 숙최저[r.목적지] = r; return; }
    if (베숙총액(r, 박) < 베숙총액(옛, 박)) 숙최저[r.목적지] = r;
  });

  베줄들 = Object.keys(항최저).filter(도 => 숙최저[도]).map(도 => {
    const ㅎ = 항최저[도], ㅅ = 숙최저[도];
    const 항 = (ㅎ.확인값 || ㅎ.가격) * 인원, 숙 = 베숙총액(ㅅ, 박);
    return {도시: 도, 항공: ㅎ, 숙소: ㅅ, 항공값: 항, 숙소값: 숙, 합계: 항 + 숙};
  }).sort((a, b) => a.합계 - b.합계).slice(0, 10);

  /* 🛑 숙소 자료는 6개월치가 아직 없다 — 그럴 땐 공장이 3개월 자료로 갈아 준다.
     항공만 보고 "괜찮다"고 넘기면 화면이 말 없이 다른 기간의 값을 섞는다 → 둘 다 적는다.
     ('📦 …에 찾아 둔 값입니다' 는 맨 위 띠가 이미 하는 말이라 잘라낸다) */
  const 알림 = [...new Set((말들 || []).map(t =>
    String(t || '').split('📦')[0].trim().replace(/·$/, '').trim()).filter(Boolean))];
  $('#베상태').textContent = 알림.join(' · ');
  베그리기(박);
}

function 베빈화면(말) {
  $('#베목록').innerHTML = `<div class="빈"><div class="큰">⭐</div>
    <div style="margin-top:14px">${홑(말)}</div></div>`;
}

function 베그리기(박) {
  if (!베줄들.length) {
    베빈화면('항공권과 숙소가 함께 준비된 도시가 없습니다 — 기간이나 숙박일수를 바꿔 보세요');
    return;
  }
  const 인원 = Math.max(1, 베객.성인);
  $('#베목록').innerHTML =
    `<div class="베머리글"><b>${베줄들.length}개 도시</b>
       <span>성인 ${인원}명 · ${박}박 · 왕복 항공권 + 숙소 예상 합계가 낮은 순</span></div>`
    + 베줄들.map((c, i) => 베카드(c, i, 박, 인원)).join('')
    + `<div class="베주">항공권은 선택하신 기간 중 가장 저렴한 날짜, 숙소는 같은 도시의 ${박}박 최저가입니다.
        두 일정이 서로 다를 수 있어 합계는 예상 금액이며, 최종 금액은 예약처에서 확인해 주세요.</div>`;
}

function 베카드(c, i, 박, 인원) {
  const ㅎ = c.항공, ㅅ = c.숙소;
  const 항곳 = ((ㅎ.예약 || [])[0] || {}).곳 || {};
  const 항주소 = 항곳['네이버'] || Object.values(항곳)[0] || '';
  const 숙예약 = Object.entries(ㅅ.예약 || {}).slice(0, 1);
  const 사진 = ㅅ.사진
    ? `<img class="베사진" src="${홑(ㅅ.사진)}" alt="" loading="lazy"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'베사진 빔',textContent:'🏨'}))">`
    : `<div class="베사진 빔">🏨</div>`;
  const 항잔 = [ㅎ.경유 === 0 ? '직항' : (ㅎ.경유 ? `경유 ${ㅎ.경유}회` : ''),
                홑((ㅎ.항공사 || '').split(',')[0].trim())].filter(Boolean).join(' · ');
  const 숙잔 = [홑(ㅅ.종류 || ''), (ㅅ.후기 || 0) ? `후기 ${ㅅ.후기.toFixed(1)}` : '후기 없음',
                ㅅ.동네 ? 홑(ㅅ.동네) : ''].filter(Boolean).join(' · ');
  return `<div class="베카드${i === 0 ? ' 으뜸' : ''}">
    <div class="베위">
      <span class="베순위">${i + 1}</span>
      <span class="베도시">${홑(c.도시)}</span>
      <span class="베나라">${홑(ㅎ.나라 || '')}</span>
      <span class="베합계"><b>${돈(c.합계)}원</b>
        <span>성인 ${인원}명 · ${박}박 예상 합계</span></span>
    </div>
    <div class="베둘">
      <div class="베칸"><div class="베속">
        <div class="베종">항공권 · 왕복</div>
        <div class="베이름">${날짜보기(ㅎ.가는날)}${ㅎ.오는날 ? ' → ' + 날짜보기(ㅎ.오는날) : ''}</div>
        <div class="베잔">${항잔 || '&nbsp;'}</div>
        <div class="베값">${돈(c.항공값)}원</div>
        <div class="베단추">${항주소
          ? `<a class="연버튼 살버튼" style="text-decoration:none" href="${홑(항주소)}"
                target="_blank" rel="noopener">항공권 보기 ↗</a>` : ''}</div>
      </div></div>
      <div class="베칸">
        ${사진}
        <div class="베속">
          <div class="베종">숙소 · ${박}박</div>
          <div class="베이름">${홑(ㅅ.이름)}</div>
          <div class="베잔">${숙잔}</div>
          <div class="베값">${돈(c.숙소값)}원</div>
          <div class="베단추">${숙예약.map(([k, v]) =>
            `<a class="연버튼 살버튼" style="text-decoration:none" href="${홑(v)}"
                target="_blank" rel="noopener">${홑(k)} ↗</a>`).join('')}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function 베바쁨(켬) {
  베도는중 = 켬;
  $('#베찾기버튼').disabled = 켬;
  $('#베찾기버튼').textContent = 켬 ? '조합하는 중…' : 'BEST 10 보기';
  const e = $('#베비행');
  if (켬) { e.classList.remove('사라짐'); e.style.display = 'block'; }
  else { e.classList.add('사라짐'); setTimeout(() => { if (!베도는중) e.style.display = 'none'; }, 480); }
}

/* ═══════════════════════════════════════════ ◀ 브라우저 뒤로 가기 = 전 단계
   🛑 8/12 대표: 항공권 → 숙박으로 넘어온 뒤 ← 를 눌렀더니 전 탭이 아니라
      **트립핏을 통째로 나가 구글 첫 화면**이 떴다. 이 화면은 한 페이지에서
      display 만 갈아 끼우는 구조라, 탭을 열 번 옮겨도 히스토리는 한 칸뿐이었다.
      브라우저가 보기엔 "들어와서 아무 데도 안 간 페이지"라 ← 는 사이트 밖이 맞다.
   ⭐ 고침 = 화면이 바뀔 때마다 자리를 쌓는다. 탭은 #숙박 처럼 해시를 남기고,
      창(덮개)은 해시 없이 자리만 쌓아 ← 한 번에 창만 닫히게 한다.
   🛑 되그리는 중에는 자리되돌림 = true — 안 걸면 뒤로 갈 때마다 또 쌓여 무한이 된다. */
let 자리되돌림 = false;
function 자리쌓기(자리) {
  // 🛑 창은 주소를 건드리지 않는다 — url 에 null 을 주면 지금 주소가 그대로 유지된다.
  //    빈 문자열('')을 주면 브라우저마다 다르게 해석해 주소가 흔들린다.
  try { history.pushState(자리, '', 자리.곳 === '탭' ? '#' + 자리.탭 : null); }
  catch (e) {}
}
function 자리고쳐쌓기() {                    // 지금 보고 있는 자리로 '첫 칸'을 채운다
  try { history.replaceState({곳: '탭', 탭: 지금탭}, '', '#' + 지금탭); } catch (e) {}
}
addEventListener('popstate', e => {
  const s = e.state || {곳: '탭', 탭: 지금탭};
  /* 창이 떠 있으면 ← 는 '창 닫기'다. s 가 창이면 그 창만 남기고 나머지를 닫는다 */
  document.querySelectorAll('.덮개.켬').forEach(d => {
    if (s.곳 !== '창' || d.id !== s.id) d.classList.remove('켬');
  });
  if (s.곳 === '창') { const d = $('#' + s.id); if (d) d.classList.add('켬'); }
  const 갈탭 = s.탭 || 지금탭;
  if (갈탭 !== 지금탭) {
    자리되돌림 = true;
    try { 탭보이기(갈탭); } finally { 자리되돌림 = false; }
  }
});

/* ─────────────────────────────────────────── 덮개
   🛑 창은 열 때 자리를 쌓고, 닫을 때 그 자리를 도로 물린다(history.back()).
      실제로 닫는 일은 popstate 한 곳에서만 한다 — ← 로 닫든 ×로 닫든 같은 길이다. */
function 열기(id) {
  const d = $('#' + id);
  if (!d || d.classList.contains('켬')) return;
  d.classList.add('켬');
  자리쌓기({곳: '창', id: id, 탭: 지금탭});
}
function 닫기(id) {
  const d = $('#' + id);
  if (!d || !d.classList.contains('켬')) return;
  if ((history.state || {}).곳 === '창' && history.state.id === id) { history.back(); return; }
  d.classList.remove('켬');                  // 자리가 어긋났으면 화면만이라도 닫는다
}
document.querySelectorAll('.덮개').forEach(d =>
  d.addEventListener('click', e => { if (e.target === d) 닫기(d.id); }));
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const 창 = [...document.querySelectorAll('.덮개.켬')].pop();
  if (창) 닫기(창.id);
});

/* 첫자리잡기 — 🛑 첫 칸에 이름표부터 단다. 안 달면 맨 앞으로 돌아왔을 때 state 가 null 이라
   어느 탭이었는지 모른다. 🛑 이때 들어온 해시(#숙박)를 먼저 읽어야 한다 —
   덮어쓰고 나서 읽으면 새로고침할 때마다 항공권으로 되돌아간다(한 번 당했다). */
const 들어온탭 = decodeURIComponent((location.hash || '').slice(1));
if (탭들.some(([, v]) => v === 들어온탭)) 지금탭 = 들어온탭;
자리고쳐쌓기();
시작();
</script>
</body>
</html>
